name: claude-cli
description: >-
  Install a pinned Claude Code CLI and hand its path to claude-code-action.

# claude-code-action@v1 installs its own Claude Code, and on 2026-09-23 that was 2.1.278 —
# which Opus 5.5 refuses ("Claude Code 2.1.278 does not support this model; version 2.1.280
# or newer is required"). The action has no version input, only
# path_to_claude_code_executable, so every agent step passes this action's output there.
# Pinned rather than `latest` so a CLI release cannot change a Thursday build; bump it here,
# once, when a model needs a newer one.

inputs:
  version:
    description: Claude Code version to install
    required: false
    default: "2.1.280"

outputs:
  path:
    description: Absolute path to the claude executable
    value: ${{ steps.install.outputs.path }}

runs:
  using: composite
  steps:
    - id: install
      shell: bash
      run: |
        set -euo pipefail
        prefix="$RUNNER_TEMP/claude-cli"
        npm install --no-audit --no-fund --prefix "$prefix" "@anthropic-ai/claude-code@${{ inputs.version }}" >/dev/null
        bin="$prefix/node_modules/.bin/claude"
        "$bin" --version
        echo "path=$bin" >> "$GITHUB_OUTPUT"
