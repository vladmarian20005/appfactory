name: app-build

# Claude Code writes the app, on a macOS runner, from apps/<slug>/SPEC.md.
#
# Authentication is a subscription token from `claude setup-token`, not an API key, so runs
# bill the owner's Claude plan rather than metered API usage.
#
# The agent is deliberately bounded: a turn cap, a job timeout, and an allowlist of tools.
# What it produces is judged by app-verify, which runs no agent at all — the agent's own
# opinion of its work is not what decides whether the build is good.

on:
  # A push to build/<slug> starts a build of that slug from main. The branch is a signal,
  # not a source: the routine that plans the week has git but no gh, and a branch push is
  # the one dispatch mechanism it is proven to have (the scout has used scout-run daily).
  push:
    branches: ["build/**"]
  workflow_dispatch:
    inputs:
      slug:
        description: App slug under apps/ (must already have SPEC.md)
        required: true
        type: string
      display_name:
        description: 'Display name, e.g. "Quizday". Blank reuses an existing project.'
        required: false
        type: string
        default: ""
      max_turns:
        description: Turn cap for the agent
        required: false
        type: string
        default: "200"
      model:
        description: Model to build with
        required: false
        type: choice
        options: [claude-opus-5, claude-sonnet-5]
        default: claude-opus-5
      chain:
        description: On success, start the next stage automatically
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write
  # Needed to dispatch app-fix. A commit pushed with GITHUB_TOKEN does not fire a `push`
  # workflow, so the fix loop has to be started explicitly rather than left to app-verify.
  actions: write

concurrency:
  group: app-${{ inputs.slug || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    # A stuck agent on a macOS runner is the most expensive failure mode available, so the
    # job is capped even though the turn limit should stop it first.
    timeout-minutes: 180
    env:
      # Resolved in Preflight when started from a trigger branch.
      SLUG: ${{ inputs.slug }}
      DISPLAY_NAME: ${{ inputs.display_name }}
      MAX_TURNS: ${{ inputs.max_turns || '200' }}
      MODEL: ${{ inputs.model || 'claude-opus-5' }}
      CHAIN: ${{ github.event_name == 'push' || inputs.chain }}
      # Where the work lands. From a trigger branch that is main, never the trigger itself.
      FACTORY_BRANCH: ${{ github.event_name == 'push' && 'main' || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && 'main' || github.ref_name }}
          fetch-depth: 0

      - name: Preflight
        env:
          HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            SLUG="${GITHUB_REF_NAME#build/}"
            echo "SLUG=$SLUG" >> "$GITHUB_ENV"
            # Consume the signal so the next push to the same name fires again.
            git push origin --delete "$GITHUB_REF_NAME" 2>/dev/null || true
            echo "Started from trigger branch $GITHUB_REF_NAME → slug $SLUG, working on main"
          fi
          if [ -z "${DISPLAY_NAME:-}" ] && [ -f "apps/$SLUG/SPEC.md" ]; then
            # The spec's title is the display name; the routine does not pass one.
            DISPLAY_NAME=$(sed -n 's/^# //p' "apps/$SLUG/SPEC.md" | head -1)
            echo "DISPLAY_NAME=$DISPLAY_NAME" >> "$GITHUB_ENV"
          fi
          # Fail here with something actionable rather than 20 minutes later, deep inside the
          # action, after a macOS runner has already booted a simulator.
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is not set. Generate one with 'claude setup-token' (it bills your Claude subscription, not the API) and add it: gh secret set CLAUDE_CODE_OAUTH_TOKEN --repo vladmarian20005/appfactory"
            exit 1
          fi
          if [ ! -f "apps/$SLUG/SPEC.md" ]; then
            echo "::error::apps/$SLUG/SPEC.md is missing. Run /plan-app or /pick first — the agent needs something to build."
            exit 1
          fi
          echo "Building from apps/$SLUG/SPEC.md"

      - uses: ./.github/actions/mac-setup
        with:
          slug: ${{ env.SLUG }}
          browser: "true"

      - name: Reset the fix counter
        run: .github/scripts/state.sh "$SLUG" set fix_attempts 0

      - name: Write the app
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The dispatcher routine runs this as the owner, but app-fix and re-runs arrive
          # as github-actions[bot], which the action refuses by default.
          allowed_bots: "github-actions"
          # Deliberately not "/new-app ...". A leading slash command is resolved before any
          # model call, and the action runs the SDK, which does not load .claude/skills
          # unless it is told to. An unresolved command ends the run in three seconds with
          # one turn and no model usage. Naming the file works whatever the SDK loads.
          prompt: |
            Read .claude/skills/new-app/SKILL.md and follow it exactly to build the app
            `${{ env.SLUG }}`, display name "${{ env.DISPLAY_NAME }}", from its
            apps/${{ env.SLUG }}/SPEC.md. Read the repository's CLAUDE.md first if there
            is one.

            You are on a GitHub macOS runner. There is no Xcode GUI, no physical device and
            nobody to ask. A simulator is already booted and its UDID is in $SIM_UDID, so
            tools/sim.sh will use it without looking one up.

            Commit AND PUSH after each screen works, not once at the end. Committing alone
            saves nothing: this checkout is on an ephemeral runner and dies with it. Push to
            the branch as you go, even when the app is half finished:
              git pull --rebase origin ${{ env.FACTORY_BRANCH }} && git push origin HEAD:${{ env.FACTORY_BRANCH }}

            Order of work, because the turn budget is finite and the first run hit it:
            1. Scaffold, icon, AppInfo, build clean. Push.
            2. Every screen in the spec, minimal but real. qa.json. Push.
            3. Make .github/scripts/verify-app.sh ${{ env.SLUG }} pass. Push.
            4. privacy.json + sync, the listing files, STATUS.md. Push.
            5. Only then dark mode and large-text passes, and only if turns remain.
            A verified app with no dark-mode check beats a beautiful one that never landed.
          claude_args: >-
            --max-turns ${{ env.MAX_TURNS }}
            --model ${{ env.MODEL }}
            --setting-sources project
            --allowedTools "Read,Edit,Write,Glob,Grep,Skill,TodoWrite,
            Bash(xcodebuild:*),Bash(xcrun:*),Bash(xcodegen:*),Bash(swift:*),
            Bash(tools/*),Bash(.github/scripts/*),Bash(node:*),Bash(npm:*),
            Bash(plutil:*),Bash(sips:*),Bash(git:*),Bash(ls:*),Bash(cat:*),
            Bash(mkdir:*),Bash(cp:*),Bash(mv:*),Bash(rm:*),Bash(find:*),Bash(wc:*)"

      # always(): if the agent step itself dies, whatever it did commit still deserves a
      # verdict, and a failed verdict is what wakes the fix loop.
      # The action revokes its own token in its post-step; without this every push below
      # fails and the work dies with the runner. See .github/scripts/git-auth.sh.
      - name: Restore push credentials
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/git-auth.sh

      - name: Verify what it produced
        id: verify
        if: always()
        continue-on-error: true
        run: .github/scripts/verify-app.sh "$SLUG"

      - name: Commit anything the agent left uncommitted
        if: always()
        run: |
          set -euo pipefail
          git config user.name "factory"
          git config user.email "factory@users.noreply.github.com"
          git add -A "apps/$SLUG"
          if git diff --cached --quiet; then
            echo "nothing left uncommitted"
          else
            git commit -m "$SLUG: build leftovers from run ${{ github.run_id }}"
          fi
          git pull --rebase origin "${FACTORY_BRANCH}" || true
          git push origin "HEAD:${FACTORY_BRANCH}" || echo "::warning::push failed; the artifact still has the work"

      - name: Record the result
        if: ${{ !cancelled() }}
        run: |
          v="${{ steps.verify.outcome == 'success' && 'ok' || 'fail' }}"
          .github/scripts/record-stage.sh "$SLUG" build "$v"
          # Same script, same judgment as app-verify — and `verify` is what the submit
          # gate reads. Without this a green build still shows the mid-build `verify fail`.
          .github/scripts/record-stage.sh "$SLUG" verify "$v"

      # The chain is explicit the whole way down, for the same reason app-fix is: a commit
      # pushed with GITHUB_TOKEN fires no `push` workflow, so nothing downstream wakes on
      # its own. Order matters — app-pages before app-compliance, because the compliance
      # gate asks whether the privacy URL answers 200, and app-pages is what publishes it.
      - name: Start the screenshots
        if: always() && steps.verify.outcome == 'success' && env.CHAIN == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh workflow run app-shots.yml -f slug="$SLUG" --ref "${FACTORY_BRANCH}"
          echo "Verify passed; app-shots dispatched." >> "$GITHUB_STEP_SUMMARY"

      - name: Hand a failure to the fix loop
        if: always() && steps.verify.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # A fix loop repairs an app; it cannot conjure one. If the agent never got as far
          # as qa.json there is nothing to iterate on, and three more agent runs would each
          # start from zero. Say so and stop.
          if [ ! -f "apps/$SLUG/qa.json" ]; then
            echo "::error::$SLUG has no qa.json — the build agent never finished scaffolding, so app-fix has nothing to repair. Re-run app-build, with more turns if it ran out."
            exit 0
          fi
          gh workflow run app-fix.yml \
            -f slug="$SLUG" \
            -f reason="app-build run ${{ github.run_id }} finished but verify-app.sh failed." \
            --ref "${FACTORY_BRANCH}"
          echo "::warning::verify failed; dispatched app-fix for $SLUG"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-${{ env.SLUG }}-${{ github.run_id }}
          path: |
            apps/${{ env.SLUG }}/qa/**
            ${{ runner.temp }}/**/*.log
          retention-days: 14
          if-no-files-found: ignore

      - name: Summary
        if: always()
        run: |
          {
            echo "## app-build \`$SLUG\` — ${{ steps.verify.outcome }}"
            echo
            if [ "${{ steps.verify.outcome }}" = "success" ]; then
              echo "Verify passed. Next: \`app-shots\`, then \`/ship $SLUG\`."
            else
              echo "Verify did not pass. \`app-fix\` was dispatched, up to 3 attempts."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          [ "${{ steps.verify.outcome }}" = "success" ]
