name: app-build

# Claude Code writes the app, on a macOS runner, from apps/<slug>/SPEC.md.
#
# Authentication is a subscription token from `claude setup-token`, not an API key, so runs
# bill the owner's Claude plan rather than metered API usage.
#
# The agent is deliberately bounded: a turn cap, a job timeout, and an allowlist of tools.
# What it produces is judged by app-verify, which runs no agent at all — the agent's own
# opinion of its work is not what decides whether the build is good.

on:
  workflow_dispatch:
    inputs:
      slug:
        description: App slug under apps/ (must already have SPEC.md)
        required: true
        type: string
      display_name:
        description: 'Display name, e.g. "Quizday". Blank reuses an existing project.'
        required: false
        type: string
        default: ""
      max_turns:
        description: Turn cap for the agent
        required: false
        type: string
        default: "120"
      model:
        description: Model to build with
        required: false
        type: choice
        options: [claude-opus-5, claude-sonnet-5]
        default: claude-opus-5
      chain:
        description: On success, start the next stage automatically
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write
  # Needed to dispatch app-fix. A commit pushed with GITHUB_TOKEN does not fire a `push`
  # workflow, so the fix loop has to be started explicitly rather than left to app-verify.
  actions: write

concurrency:
  group: app-${{ inputs.slug }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    # A stuck agent on a macOS runner is the most expensive failure mode available, so the
    # job is capped even though the turn limit should stop it first.
    timeout-minutes: 180
    env:
      SLUG: ${{ inputs.slug }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preflight
        env:
          HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          set -euo pipefail
          # Fail here with something actionable rather than 20 minutes later, deep inside the
          # action, after a macOS runner has already booted a simulator.
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is not set. Generate one with 'claude setup-token' (it bills your Claude subscription, not the API) and add it: gh secret set CLAUDE_CODE_OAUTH_TOKEN --repo vladmarian20005/appfactory"
            exit 1
          fi
          if [ ! -f "apps/$SLUG/SPEC.md" ]; then
            echo "::error::apps/$SLUG/SPEC.md is missing. Run /plan-app or /pick first — the agent needs something to build."
            exit 1
          fi
          echo "Building from apps/$SLUG/SPEC.md"

      - uses: ./.github/actions/mac-setup
        with:
          slug: ${{ inputs.slug }}
          browser: "true"

      - name: Reset the fix counter
        run: .github/scripts/state.sh "$SLUG" set fix_attempts 0

      - name: Write the app
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Deliberately not "/new-app ...". A leading slash command is resolved before any
          # model call, and the action runs the SDK, which does not load .claude/skills
          # unless it is told to. An unresolved command ends the run in three seconds with
          # one turn and no model usage. Naming the file works whatever the SDK loads.
          prompt: |
            Read .claude/skills/new-app/SKILL.md and follow it exactly to build the app
            `${{ inputs.slug }}`, display name "${{ inputs.display_name }}", from its
            apps/${{ inputs.slug }}/SPEC.md. Read the repository's CLAUDE.md first if there
            is one.

            You are on a GitHub macOS runner. There is no Xcode GUI, no physical device and
            nobody to ask. A simulator is already booted and its UDID is in $SIM_UDID, so
            tools/sim.sh will use it without looking one up.

            Commit AND PUSH after each screen works, not once at the end. Committing alone
            saves nothing: this checkout is on an ephemeral runner and dies with it. Push to
            the branch as you go, even when the app is half finished.

            Finish by making .github/scripts/verify-app.sh ${{ inputs.slug }} pass.
          claude_args: >-
            --max-turns ${{ inputs.max_turns }}
            --model ${{ inputs.model }}
            --setting-sources project
            --allowedTools "Read,Edit,Write,Glob,Grep,Skill,TodoWrite,
            Bash(xcodebuild:*),Bash(xcrun:*),Bash(xcodegen:*),Bash(swift:*),
            Bash(tools/*),Bash(.github/scripts/*),Bash(node:*),Bash(npm:*),
            Bash(plutil:*),Bash(sips:*),Bash(git:*),Bash(ls:*),Bash(cat:*),
            Bash(mkdir:*),Bash(cp:*),Bash(mv:*),Bash(rm:*),Bash(find:*),Bash(wc:*)"

      # always(): if the agent step itself dies, whatever it did commit still deserves a
      # verdict, and a failed verdict is what wakes the fix loop.
      - name: Verify what it produced
        id: verify
        if: always()
        continue-on-error: true
        run: .github/scripts/verify-app.sh "$SLUG"

      - name: Commit anything the agent left uncommitted
        if: always()
        run: |
          set -euo pipefail
          git config user.name "factory"
          git config user.email "factory@users.noreply.github.com"
          git add -A "apps/$SLUG"
          if git diff --cached --quiet; then
            echo "nothing left uncommitted"
          else
            git commit -m "$SLUG: build leftovers from run ${{ github.run_id }}"
          fi
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}" || echo "::warning::push failed; the artifact still has the work"

      - name: Record the result
        if: always()
        run: |
          .github/scripts/record-stage.sh "$SLUG" build \
            "${{ steps.verify.outcome == 'success' && 'ok' || 'fail' }}"

      # The chain is explicit the whole way down, for the same reason app-fix is: a commit
      # pushed with GITHUB_TOKEN fires no `push` workflow, so nothing downstream wakes on
      # its own. Order matters — app-pages before app-compliance, because the compliance
      # gate asks whether the privacy URL answers 200, and app-pages is what publishes it.
      - name: Start the screenshots
        if: steps.verify.outcome == 'success' && inputs.chain
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh workflow run app-shots.yml -f slug="$SLUG" --ref "${GITHUB_REF_NAME}"
          echo "Verify passed; app-shots dispatched." >> "$GITHUB_STEP_SUMMARY"

      - name: Hand a failure to the fix loop
        if: always() && steps.verify.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh workflow run app-fix.yml \
            -f slug="$SLUG" \
            -f reason="app-build run ${{ github.run_id }} finished but verify-app.sh failed." \
            --ref "${GITHUB_REF_NAME}"
          echo "::warning::verify failed; dispatched app-fix for $SLUG"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-${{ inputs.slug }}-${{ github.run_id }}
          path: |
            apps/${{ inputs.slug }}/qa/**
            ${{ runner.temp }}/**/*.log
          retention-days: 14
          if-no-files-found: ignore

      - name: Summary
        if: always()
        run: |
          {
            echo "## app-build \`${{ inputs.slug }}\` — ${{ steps.verify.outcome }}"
            echo
            if [ "${{ steps.verify.outcome }}" = "success" ]; then
              echo "Verify passed. Next: \`app-shots\`, then \`/ship ${{ inputs.slug }}\`."
            else
              echo "Verify did not pass. \`app-fix\` was dispatched, up to 3 attempts."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          [ "${{ steps.verify.outcome }}" = "success" ]
