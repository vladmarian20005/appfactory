name: app-build

# Claude Code writes the app, on a macOS runner, from apps/<slug>/SPEC.md — first its design
# direction (DESIGN.md, the icon, the mocks), then the app in that direction.
#
# Authentication is a subscription token from `claude setup-token`, not an API key, so runs
# bill the owner's Claude plan rather than metered API usage.
#
# The agent is deliberately bounded: a turn cap, a job timeout, and an allowlist of tools.
# What it produces is judged by app-verify, which runs no agent at all, and then by app-polish,
# whose critic is a different agent that never saw it being built — the builder's own opinion
# of its work is not what decides whether the build is good, or good enough to love.

on:
  # A push to build/<slug> starts a build of that slug from main. The branch is a signal,
  # not a source: the routines have git but no gh, and a branch push is the one dispatch
  # mechanism they are proven to have (the scout has used scout-run daily). The push only
  # runs the relay job below, which re-dispatches this workflow; see there for why.
  push:
    branches: ["build/**"]
  workflow_dispatch:
    inputs:
      slug:
        description: App slug under apps/ (must already have SPEC.md)
        required: true
        type: string
      display_name:
        description: 'Display name, e.g. "Quizday". Blank reuses an existing project.'
        required: false
        type: string
        default: ""
      max_turns:
        description: Turn cap for the agent
        required: false
        type: string
        default: "400"
      model:
        description: Model to build with
        required: false
        type: choice
        options: [claude-opus-5, claude-sonnet-5]
        default: claude-opus-5
      chain:
        description: On success, start the next stage automatically
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write
  # Needed to dispatch app-fix. A commit pushed with GITHUB_TOKEN does not fire a `push`
  # workflow, so the fix loop has to be started explicitly rather than left to app-verify.
  actions: write

concurrency:
  group: app-${{ inputs.slug || github.ref_name }}
  cancel-in-progress: false

jobs:
  # claude-code-action refuses a `push` event outright ("Unsupported event type: push"), so a
  # trigger branch cannot run the agent itself — the first content/<slug> push died that way
  # at the agent step. It becomes a dispatch of this same workflow on main instead, which the
  # action accepts, and workflow_dispatch is one of the two events GITHUB_TOKEN may still
  # fire. The dispatched run's actor is github-actions[bot], hence allowed_bots below.
  relay:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch the build on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          slug="${GITHUB_REF_NAME#build/}"
          # Consume the signal so the next push to the same name fires again.
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$GITHUB_REF_NAME" --silent || true
          # Fail here, in seconds on Linux, rather than after a macOS runner has booted.
          if ! gh api "repos/$GITHUB_REPOSITORY/contents/apps/$slug/SPEC.md?ref=main" --silent; then
            echo "::error::apps/$slug/SPEC.md is not on main. Push the spec first, then the build/$slug trigger."
            exit 1
          fi
          gh workflow run app-build.yml --repo "$GITHUB_REPOSITORY" --ref main -f slug="$slug" -f chain=true
          echo "\`$GITHUB_REF_NAME\` → app-build dispatched for \`$slug\` on main." >> "$GITHUB_STEP_SUMMARY"

  build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    # A stuck agent on a macOS runner is the most expensive failure mode available, so the
    # job is capped even though the turn limits should stop it first. Direction takes about
    # 25 minutes of it, the build the rest.
    timeout-minutes: 270
    env:
      SLUG: ${{ inputs.slug }}
      DISPLAY_NAME: ${{ inputs.display_name }}
      MAX_TURNS: ${{ inputs.max_turns || '400' }}
      MODEL: ${{ inputs.model || 'claude-opus-5' }}
      CHAIN: ${{ inputs.chain }}
      # Where the work lands: the branch this was dispatched on, main when the relay did it.
      FACTORY_BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preflight
        env:
          HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          set -euo pipefail
          if [ -z "${DISPLAY_NAME:-}" ] && [ -f "apps/$SLUG/SPEC.md" ]; then
            # The spec's title is the display name; the routine does not pass one.
            DISPLAY_NAME=$(sed -n 's/^# //p' "apps/$SLUG/SPEC.md" | head -1)
            echo "DISPLAY_NAME=$DISPLAY_NAME" >> "$GITHUB_ENV"
          fi
          # Fail here with something actionable rather than 20 minutes later, deep inside the
          # action, after a macOS runner has already booted a simulator.
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is not set. Generate one with 'claude setup-token' (it bills your Claude subscription, not the API) and add it: gh secret set CLAUDE_CODE_OAUTH_TOKEN --repo vladmarian20005/appfactory"
            exit 1
          fi
          if [ ! -f "apps/$SLUG/SPEC.md" ]; then
            echo "::error::apps/$SLUG/SPEC.md is missing. Run /plan-app or /pick first — the agent needs something to build."
            exit 1
          fi
          echo "Building from apps/$SLUG/SPEC.md"

      - uses: ./.github/actions/mac-setup
        with:
          slug: ${{ env.SLUG }}
          browser: "true"

      - name: Reset the fix and polish counters
        run: |
          .github/scripts/state.sh "$SLUG" set fix_attempts 0
          .github/scripts/state.sh "$SLUG" set polish_attempts 0

      # Before a line of Swift: what the app is like. The first two apps were built straight
      # from a market spec and came out as the template in a new accent color. DESIGN.md is
      # the idea, the palette, the signature interaction, the reward and the voice, with an
      # icon and mocks, written by an agent whose only job is taste. A separate agent, so the
      # builder starts from a finished brief with its whole turn budget.
      - name: Is there a design direction
        id: design
        run: |
          if [ -f "apps/$SLUG/DESIGN.md" ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; echo "DESIGN.md exists; keeping it."
          else echo "exists=false" >> "$GITHUB_OUTPUT"; fi

      - name: Direct the app
        id: direct
        if: steps.design.outputs.exists == 'false'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "github-actions"
          prompt: |
            Read TASTE.md, then .claude/skills/direct/SKILL.md, and follow the skill exactly to
            write the design direction for `${{ env.SLUG }}` ("${{ env.DISPLAY_NAME }}") from
            apps/${{ env.SLUG }}/SPEC.md. Read the repository's CLAUDE.md first.

            You are on a GitHub macOS runner with no GUI and nobody to ask. Playwright's WebKit
            and Chromium are installed for tools/design/render.mjs and tools/icon.mjs.

            Commit AND PUSH as you go:
              git pull --rebase origin ${{ env.FACTORY_BRANCH }} && git push origin HEAD:${{ env.FACTORY_BRANCH }}

            Do not scaffold the app or write Swift; the next agent builds from what you write.
          claude_args: >-
            --max-turns 120
            --model ${{ env.MODEL }}
            --setting-sources project
            --allowedTools "Read,Edit,Write,Glob,Grep,Skill,TodoWrite,
            Bash(node:*),Bash(tools/*),Bash(sips:*),Bash(git:*),Bash(ls:*),Bash(cat:*),
            Bash(mkdir:*),Bash(cp:*),Bash(mv:*),Bash(rm:*),Bash(find:*),Bash(wc:*)"

      # The builder's first `git pull --rebase` refuses to run over uncommitted files, so
      # whatever the direction agent wrote and did not commit is committed here, and pushed.
      - name: Keep the direction
        if: always() && steps.direct.outcome != 'skipped'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          .github/scripts/git-auth.sh
          git config user.name "factory"
          git config user.email "factory@users.noreply.github.com"
          git add -A "apps/$SLUG"
          git diff --cached --quiet || git commit -m "$SLUG: design direction leftovers from run ${{ github.run_id }}"
          git pull --rebase origin "${FACTORY_BRANCH}" || true
          git push origin "HEAD:${FACTORY_BRANCH}" || echo "::warning::push failed; the builder still has the files"
          [ -f "apps/$SLUG/DESIGN.md" ] || echo "::warning::the direction agent wrote no DESIGN.md; the builder is told to write one first"

      - name: Write the app
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # A build from a trigger branch is dispatched by the relay job, so it arrives as
          # github-actions[bot], which the action refuses by default.
          allowed_bots: "github-actions"
          # Deliberately not "/new-app ...". A leading slash command is resolved before any
          # model call, and the action runs the SDK, which does not load .claude/skills
          # unless it is told to. An unresolved command ends the run in three seconds with
          # one turn and no model usage. Naming the file works whatever the SDK loads.
          prompt: |
            Read TASTE.md, then .claude/skills/new-app/SKILL.md, and follow the skill exactly
            to build the app `${{ env.SLUG }}`, display name "${{ env.DISPLAY_NAME }}", from
            apps/${{ env.SLUG }}/SPEC.md in the direction apps/${{ env.SLUG }}/DESIGN.md sets.
            Read the repository's CLAUDE.md first.

            You are on a GitHub macOS runner. There is no Xcode GUI, no physical device and
            nobody to ask. A simulator is already booted and its UDID is in $SIM_UDID, so
            tools/sim.sh will use it without looking one up.

            Commit AND PUSH after each screen works, not once at the end. Committing alone
            saves nothing: this checkout is on an ephemeral runner and dies with it. Push to
            the branch as you go, even when the app is half finished:
              git pull --rebase origin ${{ env.FACTORY_BRANCH }} && git push origin HEAD:${{ env.FACTORY_BRANCH }}

            Order of work, because the turn budget is finite:
            1. Scaffold; AppBrand.swift from DESIGN.md's tokens; the drawn icon and art;
               AppInfo; build clean. Push.
            2. The core screen with its signature interaction, then the reward, exactly as
               DESIGN.md describes them, in the brand from the first line. Push.
            3. DESIGN.md's "The play", which is what makes anyone open this a second time:
               the FactoryKit `Ladder` (still climbing at session 150 — `climbs(through:)`),
               the rule that chooses the next unit from what the player has done (`Mastery`,
               or the app's own), the `Run` holding what is at risk this session, and the one
               `Earned` milestone that arrives for playing rather than paying. Never `%` over
               a fixed list and never uniform random. Push.
            4. Every other screen in the spec, in the brand. qa.json with screens, moments,
               and `ladder` — the same screen at three or four points from a first session to
               one weeks in, which is the only evidence the critic has that the app keeps
               changing. Push.
            5. Make .github/scripts/verify-app.sh ${{ env.SLUG }} pass and
               node tools/design/tells.mjs ${{ env.SLUG }} report no FAIL. Push.
            6. privacy.json + sync, the listing files, STATUS.md. Push.
            7. Dark mode and large text, against the mocks, with the turns that remain.
            Neither styling nor the play is a pass that comes after the app works. An app that
            works and looks like the template fails the next stage, which is a critic with
            TASTE.md — and so does one that is beautiful and identical on its fortieth session.
          claude_args: >-
            --max-turns ${{ env.MAX_TURNS }}
            --model ${{ env.MODEL }}
            --setting-sources project
            --allowedTools "Read,Edit,Write,Glob,Grep,Skill,TodoWrite,
            Bash(xcodebuild:*),Bash(xcrun:*),Bash(xcodegen:*),Bash(swift:*),
            Bash(tools/*),Bash(.github/scripts/*),Bash(node:*),Bash(npm:*),
            Bash(plutil:*),Bash(sips:*),Bash(git:*),Bash(ls:*),Bash(cat:*),
            Bash(mkdir:*),Bash(cp:*),Bash(mv:*),Bash(rm:*),Bash(find:*),Bash(wc:*)"

      # always(): if the agent step itself dies, whatever it did commit still deserves a
      # verdict, and a failed verdict is what wakes the fix loop.
      # The action revokes its own token in its post-step; without this every push below
      # fails and the work dies with the runner. See .github/scripts/git-auth.sh.
      - name: Restore push credentials
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/git-auth.sh

      - name: Verify what it produced
        id: verify
        if: always()
        continue-on-error: true
        run: .github/scripts/verify-app.sh "$SLUG"

      - name: Commit anything the agent left uncommitted
        if: always()
        run: |
          set -euo pipefail
          git config user.name "factory"
          git config user.email "factory@users.noreply.github.com"
          git add -A "apps/$SLUG"
          if git diff --cached --quiet; then
            echo "nothing left uncommitted"
          else
            git commit -m "$SLUG: build leftovers from run ${{ github.run_id }}"
          fi
          git pull --rebase origin "${FACTORY_BRANCH}" || true
          git push origin "HEAD:${FACTORY_BRANCH}" || echo "::warning::push failed; the artifact still has the work"

      - name: Record the result
        if: ${{ !cancelled() }}
        run: |
          v="${{ steps.verify.outcome == 'success' && 'ok' || 'fail' }}"
          .github/scripts/record-stage.sh "$SLUG" build "$v"
          # Same script, same judgment as app-verify — and `verify` is what the submit
          # gate reads. Without this a green build still shows the mid-build `verify fail`.
          .github/scripts/record-stage.sh "$SLUG" verify "$v"

      # The chain is explicit the whole way down, for the same reason app-fix is: a commit
      # pushed with GITHUB_TOKEN fires no `push` workflow, so nothing downstream wakes on
      # its own. A verified app goes to the taste gate first, because the screenshots, the
      # listing and the page are all of the app as it will ship; app-polish continues to
      # app-aso when the critic passes it.
      - name: Hand the app to the critic
        if: always() && steps.verify.outcome == 'success' && env.CHAIN == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh workflow run app-polish.yml -f slug="$SLUG" --ref "${FACTORY_BRANCH}"
          echo "Verify passed; app-polish dispatched." >> "$GITHUB_STEP_SUMMARY"

      - name: Hand a failure to the fix loop
        if: always() && steps.verify.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # A fix loop repairs an app; it cannot conjure one. If the agent never got as far
          # as qa.json there is nothing to iterate on, and three more agent runs would each
          # start from zero. Say so and stop.
          if [ ! -f "apps/$SLUG/qa.json" ]; then
            echo "::error::$SLUG has no qa.json — the build agent never finished scaffolding, so app-fix has nothing to repair. Re-run app-build, with more turns if it ran out."
            exit 0
          fi
          gh workflow run app-fix.yml \
            -f slug="$SLUG" \
            -f reason="app-build run ${{ github.run_id }} finished but verify-app.sh failed." \
            --ref "${FACTORY_BRANCH}"
          echo "::warning::verify failed; dispatched app-fix for $SLUG"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-${{ env.SLUG }}-${{ github.run_id }}
          path: |
            apps/${{ env.SLUG }}/qa/**
            apps/${{ env.SLUG }}/design/**
            ${{ runner.temp }}/**/*.log
          retention-days: 14
          if-no-files-found: ignore

      - name: Summary
        if: always()
        run: |
          {
            echo "## app-build \`$SLUG\` — ${{ steps.verify.outcome }}"
            echo
            if [ "${{ steps.verify.outcome }}" = "success" ]; then
              echo "Verify passed. Next: \`app-polish\` (the taste gate), then \`app-aso\`, \`app-shots\`, \`app-pages\`, \`app-compliance\`, then SUBMIT."
            else
              echo "Verify did not pass. \`app-fix\` was dispatched, up to 3 attempts."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          [ "${{ steps.verify.outcome }}" = "success" ]
