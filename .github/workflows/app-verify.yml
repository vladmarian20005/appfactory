name: app-verify

# Deterministic gate: build the app, launch every screen in its qa.json, prove each one
# rendered, and prove nothing crashed. No agent runs here, so it is cheap, repeatable and
# safe to run on every push. It is what the fix loop measures itself against.

on:
  workflow_dispatch:
    inputs:
      slug:
        description: App slug under apps/
        required: true
        type: string
      xcode:
        description: 'Xcode version, e.g. "26.6". Blank uses the runner default.'
        required: false
        type: string
        default: ""
  push:
    branches: [main]
    paths:
      - "FactoryKit/**"
      - "apps/*/ios/**"
      - "apps/*/qa.json"
      - "apps/*/STATUS.md"
      - "tools/sim.sh"
      - "tools/qa/**"
      - ".github/workflows/app-verify.yml"
      - ".github/scripts/verify-app.sh"
      - ".github/scripts/bundle-check.sh"

permissions:
  # write so each leg can record its result in apps/<slug>/state.json. Later stages read
  # that to tell "verified" from "verified, then rewritten".
  contents: write
  # to ask whether an app-build is running before a push-triggered verify goes ahead
  actions: read

concurrency:
  group: app-${{ inputs.slug || 'push' }}-verify
  cancel-in-progress: true

jobs:
  pick:
    # On a push the event does not say which app changed, so ask the diff.
    runs-on: ubuntu-latest
    outputs:
      slugs: ${{ steps.list.outputs.slugs }}
    steps:
      - uses: actions/checkout@v4
      # The build, fix and polish agents' pushes fire this (they are not made with
      # GITHUB_TOKEN), and a run that starts on a half-written app can finish after the
      # agent's own verdict and overwrite a green verify with a stale red one. So on a push,
      # if any app-build, app-fix or app-polish is in progress, stand down: all three run
      # this same script themselves when their agent is done, and record the verdict.
      - name: Stand down while the factory is building
        id: building
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          n=0
          for wf in app-build.yml app-fix.yml app-polish.yml; do
            k=$(gh run list --workflow="$wf" --repo "$GITHUB_REPOSITORY" \
                  --json status -q '[.[] | select(.status=="in_progress" or .status=="queued")] | length' 2>/dev/null || echo 0)
            n=$((n + ${k:-0}))
          done
          if [ "$n" -gt 0 ]; then
            echo "building=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$n agent run(s) in progress; skipping the push-triggered check so it cannot race their verdict."
          else
            echo "building=false" >> "$GITHUB_OUTPUT"
          fi
      - id: list
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # Apps that are going somewhere: a qa.json to verify against, and not shelved.
          # plainfood is kept as the reference app and would otherwise cost a macOS runner
          # on every push forever.
          shipping() {
            for d in apps/*/; do
              s=$(basename "$d")
              [ -f "$d/qa.json" ] || continue
              stage=$(sed -n 's/^stage:[[:space:]]*//p' "$d/STATUS.md" 2>/dev/null | head -1)
              case "$stage" in shelved*|stopped*|archived*) continue ;; esac
              echo "$s"
            done
          }
          if [ "${{ steps.building.outputs.building }}" = "true" ]; then
            picked=""
          elif [ -n "${{ inputs.slug }}" ]; then
            picked="${{ inputs.slug }}"
          else
            # Only the apps this push touched. A change outside apps/ (FactoryKit, sim.sh,
            # this workflow) can affect every app, so then verify them all. The compare API
            # needs no history, which keeps this checkout shallow.
            changed=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$GITHUB_SHA" \
                        --paginate -q '.files[].filename' 2>/dev/null || echo "")
            if [ -z "$changed" ] || echo "$changed" | grep -qv '^apps/'; then
              picked=$(shipping)
            else
              picked=$(shipping | while read -r s; do
                echo "$changed" | grep -q "^apps/$s/" && echo "$s" || true
              done)
            fi
          fi
          slugs=$(printf '%s\n' "$picked" | node -e '
            let s="";process.stdin.on("data",d=>s+=d).on("end",()=>
              console.log(JSON.stringify(s.split("\n").map(x=>x.trim()).filter(Boolean))))')
          echo "slugs=$slugs" >> "$GITHUB_OUTPUT"
          echo "Verifying: $slugs"

  verify:
    needs: pick
    if: needs.pick.outputs.slugs != '[]'
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        slug: ${{ fromJSON(needs.pick.outputs.slugs) }}
    steps:
      - uses: actions/checkout@v4
        with:
          # record-stage.sh rebases when two legs push at once, which a shallow clone cannot.
          fetch-depth: 0

      - uses: ./.github/actions/mac-setup
        with:
          slug: ${{ matrix.slug }}
          xcode: ${{ inputs.xcode }}

      # continue-on-error so the result is recorded either way; the job is failed at the end.
      - name: Verify
        id: verify
        continue-on-error: true
        run: .github/scripts/verify-app.sh "${{ matrix.slug }}"

      # not always(): a cancelled run has judged nothing, and always() fires on cancel.
      - name: Record the result
        if: ${{ !cancelled() }}
        run: |
          .github/scripts/record-stage.sh "${{ matrix.slug }}" verify \
            "${{ steps.verify.outcome == 'success' && 'ok' || 'fail' }}"

      - name: Downscale the captures
        if: always()
        run: |
          set -euo pipefail
          shopt -s nullglob
          shots=(apps/${{ matrix.slug }}/qa/*.png)
          [ ${#shots[@]} -gt 0 ] || exit 0
          # Full 1320x2868 captures make a slow artifact to download just to glance at.
          mkdir -p "$RUNNER_TEMP/small"
          for f in "${shots[@]}"; do
            sips -Z 900 "$f" --out "$RUNNER_TEMP/small/$(basename "$f")" >/dev/null
          done
          echo "Captured ${#shots[@]} screen(s) for \`${{ matrix.slug }}\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-${{ matrix.slug }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/small/**
            apps/${{ matrix.slug }}/qa/**
            ~/Library/Logs/DiagnosticReports/**
          retention-days: 14
          if-no-files-found: warn

      - name: Fail the job if verify failed
        if: steps.verify.outcome != 'success'
        run: |
          echo "::error::${{ matrix.slug }} did not pass verification."
          exit 1
