name: app-compliance

# The gate between "built" and "submittable". Runs on Linux: it needs no Xcode, no
# simulator and no credentials, so it is cheap enough to run on every push. When the chain
# dispatches it and it passes, it starts app-register, which does hold credentials.

on:
  workflow_dispatch:
    inputs:
      slug:
        description: App slug under apps/
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - "apps/*/store/**"
      - "apps/*/ios/App/PrivacyInfo.xcprivacy"
      - "apps/*/ios/App/Products.storekit"
      - "apps/*/iap.json"
      - "FactoryKit/Sources/FactoryKit/PaywallView.swift"
      - ".github/scripts/compliance.sh"
      - "tools/asc/products.mjs"
      - ".github/workflows/app-compliance.yml"

permissions:
  # write only to record the outcome in apps/<slug>/state.json.
  contents: write
  # read to see whether an agent is building; write to start app-register when the gate passes.
  actions: write

concurrency:
  group: compliance-${{ inputs.slug || github.ref }}
  cancel-in-progress: true

jobs:
  pick:
    runs-on: ubuntu-latest
    outputs:
      slugs: ${{ steps.list.outputs.slugs }}
    steps:
      - uses: actions/checkout@v4
      # The build and fix agents' pushes fire this (they are not made with GITHUB_TOKEN), and
      # a run that starts on a half-written app can finish after the agent's own verdict and
      # overwrite a green result with a stale red one. So on a push, if any app-build or
      # app-fix is in progress, stand down: they run this same script when the agent is done.
      - name: Stand down while the factory is building
        id: building
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          n=0
          for wf in app-build.yml app-fix.yml; do
            k=$(gh run list --workflow="$wf" --repo "$GITHUB_REPOSITORY" \
                  --json status -q '[.[] | select(.status=="in_progress" or .status=="queued")] | length' 2>/dev/null || echo 0)
            n=$((n + ${k:-0}))
          done
          if [ "$n" -gt 0 ]; then
            echo "building=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$n agent run(s) in progress; skipping the push-triggered check so it cannot race their verdict."
          else
            echo "building=false" >> "$GITHUB_OUTPUT"
          fi
      - id: list
        run: |
          set -euo pipefail
          if [ "${{ steps.building.outputs.building }}" = "true" ]; then
            slugs='[]'
          elif [ -n "${{ inputs.slug }}" ]; then
            slugs='["${{ inputs.slug }}"]'
          else
            # Only apps that are actually heading for the App Store. Two exclusions:
            # one with no store/metadata has not started a listing, and one whose STATUS.md
            # says shelved or stopped is never going to ship — plainfood is kept as the
            # reference app and would otherwise fail this gate on every push forever.
            picked=""
            for d in apps/*/; do
              slug=$(basename "$d")
              [ -d "$d/store/metadata/en-US" ] || continue
              stage=$(sed -n 's/^stage:[[:space:]]*//p' "$d/STATUS.md" 2>/dev/null | head -1)
              case "$stage" in
                shelved*|stopped*|archived*) echo "skipping $slug (stage: $stage)"; continue ;;
              esac
              picked="$picked$slug\n"
            done
            slugs=$(printf "$picked" | node -e '
              let s="";process.stdin.on("data",d=>s+=d).on("end",()=>
                console.log(JSON.stringify(s.split("\n").filter(Boolean))))')
          fi
          echo "slugs=$slugs" >> "$GITHUB_OUTPUT"
          echo "Checking: $slugs"

  compliance:
    needs: pick
    if: needs.pick.outputs.slugs != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        slug: ${{ fromJSON(needs.pick.outputs.slugs) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # compliance.sh uses plutil to validate the privacy manifest; Linux has no plutil.
      - name: Provide plutil
        run: |
          set -euo pipefail
          sudo tee /usr/local/bin/plutil >/dev/null <<'SH'
          #!/usr/bin/env bash
          # Minimal stand-in: `plutil -lint <file>` well-formedness check via Python.
          [ "${1:-}" = "-lint" ] || { echo "plutil shim: only -lint is supported" >&2; exit 2; }
          shift
          rc=0
          for f in "$@"; do
            if python3 -c "import plistlib,sys; plistlib.load(open(sys.argv[1],'rb'))" "$f" 2>/dev/null; then
              echo "$f: OK"
            else
              echo "$f: parse error"; rc=1
            fi
          done
          exit $rc
          SH
          sudo chmod +x /usr/local/bin/plutil
          plutil -lint apps/${{ matrix.slug }}/ios/App/PrivacyInfo.xcprivacy || true

      - name: Compliance gate
        id: gate
        continue-on-error: true
        run: .github/scripts/compliance.sh "${{ matrix.slug }}"

      - name: Record the result
        if: ${{ !cancelled() }}
        run: |
          .github/scripts/record-stage.sh "${{ matrix.slug }}" compliance \
            "${{ steps.gate.outcome == 'success' && 'ok' || 'fail' }}"

      - name: Fail the job if the gate failed
        if: steps.gate.outcome != 'success'
        run: exit 1

      # The chain's last link. Only on a dispatch: that is the chain (or a human) asking about
      # one app, where a push-triggered run is a re-check of everything.
      - name: Register the bundle id next
        if: github.event_name == 'workflow_dispatch' && steps.gate.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run app-register.yml -f slug="${{ matrix.slug }}" --ref "${GITHUB_REF_NAME}"
          echo "app-register dispatched: the bundle id goes into App Store Connect next." >> "$GITHUB_STEP_SUMMARY"

      - name: Summary
        if: always()
        run: |
          if [ "${{ steps.gate.outcome }}" = "success" ]; then
            echo "✅ \`${{ matrix.slug }}\` passes the compliance gate." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ \`${{ matrix.slug }}\` is not ready for App Review. See the errors above." >> "$GITHUB_STEP_SUMMARY"
          fi
