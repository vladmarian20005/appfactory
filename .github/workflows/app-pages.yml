name: app-pages

# Generate the app's privacy policy, terms and support page and publish it, so the URL is
# live before anything is submitted. `precheck` fails a submission on a privacy URL that
# 404s, and it does so after the upload.
#
# The page goes to the starhiveconcept-site repo, whose own workflow deploys site/ to
# Cloudflare Pages. This job waits for the deployed URL to answer 200 before it reports
# success — a commit is not a published page.

on:
  workflow_dispatch:
    inputs:
      slug:
        description: App slug under apps/
        required: true
        type: string
      publish:
        description: Push to starhiveconcept-site. Off = generate and inspect only.
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: app-pages-${{ inputs.slug }}
  cancel-in-progress: false

jobs:
  pages:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SLUG: ${{ inputs.slug }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate
        run: |
          set -euo pipefail
          node tools/pages/build.mjs "$SLUG"
          {
            echo "PAGE_SLUG=$(node -p "require('./apps/$SLUG/privacy.json').pageSlug")"
            echo "COMPANY_URL=$(node -p "require('./apps/$SLUG/privacy.json').companyURL")"
          } >> "$GITHUB_ENV"

      - name: Commit the generated page here
        run: |
          set -euo pipefail
          git config user.name "factory"
          git config user.email "factory@users.noreply.github.com"
          git add "apps/$SLUG/store/page"
          if git diff --cached --quiet; then
            echo "page unchanged"
          else
            git commit -m "$SLUG: regenerate the privacy and support page"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Publish to starhiveconcept-site
        if: inputs.publish
        env:
          SITE_REPO_TOKEN: ${{ secrets.SITE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          : "${SITE_REPO_TOKEN:?not set. Create a fine-grained PAT with contents:write on starhiveconcept-site only.}"
          git clone --depth 1 \
            "https://x-access-token:${SITE_REPO_TOKEN}@github.com/vladmarian20005/starhiveconcept-site.git" site-repo
          mkdir -p "site-repo/site/$PAGE_SLUG"
          cp "apps/$SLUG/store/page/index.html" "site-repo/site/$PAGE_SLUG/index.html"
          cd site-repo
          git config user.name "factory"
          git config user.email "factory@users.noreply.github.com"
          git add "site/$PAGE_SLUG/index.html"
          if git diff --cached --quiet; then
            echo "site already up to date"
          else
            git commit -m "$SLUG: privacy policy and terms, generated by the factory"
            git push origin HEAD:main
            echo "pushed; Cloudflare Pages deploys on push to main"
          fi

      - name: Wait for the page to go live
        if: inputs.publish
        run: |
          set -euo pipefail
          url="${COMPANY_URL%/}/$PAGE_SLUG/"
          echo "Waiting for $url"
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -L "$url" || echo 000)
            if [ "$code" = "200" ]; then
              echo "live: $url"
              echo "✅ [$url]($url) is live." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "  $code, retrying ($i/30)"
            sleep 10
          done
          echo "::error::$url never returned 200. App Review needs a reachable privacy policy."
          exit 1

      - name: Record the result
        if: always()
        run: |
          .github/scripts/record-stage.sh "$SLUG" pages \
            "${{ job.status == 'success' && 'ok' || 'fail' }}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: page-${{ inputs.slug }}-${{ github.run_id }}
          path: apps/${{ inputs.slug }}/store/page/**
          retention-days: 14
          if-no-files-found: warn
