name: app-submit

# Archives with a real distribution signature and uploads to TestFlight.
#
# This is the gate. It only runs when a human dispatches it and types SUBMIT, because it is
# the step that puts a build on Apple's servers under the owner's developer account. Every
# stage before it runs unattended.
#
# It never runs on `pull_request`. This repository is public, and that is what keeps the
# App Store Connect key and the distribution certificate out of reach of anyone who opens a
# PR — GitHub withholds secrets from fork pull requests, and workflow_dispatch requires
# write access.

on:
  workflow_dispatch:
    inputs:
      slug:
        description: App slug under apps/
        required: true
        type: string
      confirm:
        description: Type SUBMIT to confirm an upload to App Store Connect
        required: true
        type: string
      override_gate:
        description: Upload even if a prior stage did not pass on this code. Say why in the run.
        required: false
        type: boolean
        default: false

permissions:
  # write only to record that the submit happened, in apps/<slug>/state.json.
  contents: write

concurrency:
  group: app-${{ inputs.slug }}
  cancel-in-progress: false

jobs:
  upload:
    if: inputs.confirm == 'SUBMIT'
    runs-on: macos-26
    timeout-minutes: 60
    env:
      SLUG: ${{ inputs.slug }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BUNDLE_PREFIX: ${{ secrets.BUNDLE_PREFIX }}
      REVIEW_FIRST_NAME: ${{ secrets.REVIEW_FIRST_NAME }}
      REVIEW_LAST_NAME: ${{ secrets.REVIEW_LAST_NAME }}
      REVIEW_PHONE: ${{ secrets.REVIEW_PHONE }}
      REVIEW_EMAIL: ${{ secrets.REVIEW_EMAIL }}
      SUPPORT_EMAIL: ${{ secrets.SUPPORT_EMAIL }}
      # fastlane on a cold runner: the default 10s timeout for reading build settings is not
      # enough, and a non-UTF8 locale makes deliver fail on any non-ASCII metadata.
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      FASTLANE_SKIP_UPDATE_CHECK: "1"
      FASTLANE_HIDE_CHANGELOG: "1"
      FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "180"
      FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "6"
    steps:
      - uses: actions/checkout@v4
        with:
          # The gate below asks whether a stage's commit is an ancestor of HEAD, which needs
          # the history to answer.
          fetch-depth: 0

      # Everything expensive is below this. An upload is the one irreversible thing the
      # factory does, so it refuses code whose green results belong to a different version
      # of itself: an agent can fix a build, get a green verify, then rewrite three screens.
      #
      # `design` is in the list because taste is a gate, not a review step. Without it the
      # taste bar is only an edge in the chain — true while the chain runs in order, and
      # walked around by any direct dispatch or by app-await-record's cron. An app that
      # never faced the critic does not go to TestFlight.
      - name: Refuse to upload unverified, stale or untasted code
        run: |
          set -euo pipefail
          if .github/scripts/require-stage.sh "$SLUG" verify compliance pages design; then
            exit 0
          fi
          if [ "${{ inputs.override_gate }}" = "true" ]; then
            echo "::warning::The stage gate failed and override_gate was set. Uploading anyway."
            echo "⚠️ Uploaded past a failed stage gate, by explicit override." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "Re-run the stage named above, or dispatch again with override_gate." >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Read the app's facts
        run: |
          set -euo pipefail
          scheme=$(node -p "require('./apps/$SLUG/qa.json').scheme")
          bundle=$(node -p "require('./apps/$SLUG/qa.json').bundleId")
          name=$(cat "apps/$SLUG/store/metadata/en-US/name.txt")
          {
            echo "SCHEME=$scheme"
            echo "BUNDLE_ID=$bundle"
            echo "APP_NAME=$name"
            # Monotonic and unique: the build number cannot come from the .xcodeproj, which
            # XcodeGen regenerates on every runner.
            echo "BUILD_NUMBER=$(date -u +%Y%m%d%H%M)"
          } >> "$GITHUB_ENV"
          echo "Submitting $name ($bundle), scheme $scheme"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          : "${ASC_KEY_P8:?ASC_KEY_P8 is not set; run tools/push-secrets.sh}"
          mkdir -p ~/.appstoreconnect && chmod 700 ~/.appstoreconnect
          printf '%s' "$ASC_KEY_P8" > ~/.appstoreconnect/AuthKey_${ASC_KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/AuthKey_${ASC_KEY_ID}.p8
          echo "ASC_KEY_PATH=$HOME/.appstoreconnect/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      # Before anything expensive. The bundle id registers itself (app-register did it when
      # the chain finished; this is the same idempotent call). The app record is the one form
      # Apple keeps for a browser, so without it this fails in seconds with the fields to
      # type, rather than after the archive.
      - name: App record
        run: node tools/asc/register.mjs "$SLUG" --require-app

      # The products the paywall asks for, from Products.storekit, all the way to Ready to
      # Submit: price, availability, localization, review screenshot. They have to exist
      # before the owner's TestFlight pass, or the sandbox purchase has nothing to buy.
      # Idempotent, and it exits non-zero on anything left unfinished.
      - name: In-app purchases
        run: node tools/asc/iap.mjs "$SLUG" --apply

      # A new app has no TestFlight group, so without this the upload reaches nobody. An
      # internal group with access to every build, and the owner (REVIEW_EMAIL) in it.
      - name: TestFlight access for the owner
        run: node tools/asc/testflight.mjs "$SLUG" --apply

      # Archiving does not need a simulator, and booting one costs two minutes.
      - uses: ./.github/actions/mac-setup
        with:
          slug: ${{ inputs.slug }}
          boot-simulator: "false"

      - name: Import the distribution identity
        env:
          DIST_CERT_P12_BASE64: ${{ secrets.DIST_CERT_P12_BASE64 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: .github/scripts/keychain-up.sh

      - name: Archive and upload to TestFlight
        run: |
          cd tools/fastlane
          APP_DIR="../../apps/$SLUG/ios" fastlane beta

      - name: Destroy the keychain
        if: always()
        run: .github/scripts/keychain-down.sh

      - name: Record the result
        if: always()
        run: |
          .github/scripts/record-stage.sh "$SLUG" submit \
            "${{ job.status == 'success' && 'ok' || 'fail' }}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-${{ inputs.slug }}-${{ env.BUILD_NUMBER }}
          path: |
            apps/${{ inputs.slug }}/ios/.build/archive/*.ipa
            apps/${{ inputs.slug }}/ios/.build/archive/**/*.dSYM.zip
            ~/Library/Logs/gym/**
          retention-days: 30
          if-no-files-found: warn

      - name: What happens next
        if: success()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'MD'
          ## Uploaded to TestFlight

          Build `${{ env.BUILD_NUMBER }}` of **${{ env.APP_NAME }}** is processing. Apple
          usually takes 5–30 minutes. Its in-app purchases are in App Store Connect, ready to
          submit, so the sandbox purchase below has something to buy.

          Next, on a phone — no laptop needed:

          1. Install the build from TestFlight.
          2. Work the device checklist: the daily reminder fires, haptics feel right, the
             share sheet opens, and **a sandbox purchase completes**. That last one cannot be
             checked on CI: a scheme's StoreKit configuration is never honoured by a
             `simctl launch`, so no runner can buy anything.
          3. If it passes, run `app-release`. It pushes the listing and screenshots, sets the
             age rating, categories, price and availability, attaches this build and every
             in-app purchase, and submits the lot for review.
          MD
