name: app-release

# Launch: the listing, then everything else a first release needs, then App Review.
# `deliver` pushes the listing text, screenshots and review contact. tools/asc/release.mjs
# sets content rights, categories, the age rating, the price and availability, attaches the
# processed build, and submits the version together with every in-app purchase — an app's
# first purchases can only be reviewed with a version, and deliver cannot add them.
# Runs on Linux: none of it needs Xcode or a keychain.
#
# App Privacy is the one requirement the API cannot set; the owner answers it once, in the
# same visit as creating the app record, and tools/asc/register.mjs prints the answers.
#
# Split from app-submit on purpose. The beta lane passes
# skip_waiting_for_build_processing: true, so the archive job ends as soon as the upload
# does, and this job picks up the processed build later.

on:
  workflow_dispatch:
    inputs:
      slug:
        description: App slug under apps/
        required: true
        type: string
      confirm:
        description: Type SUBMIT to submit this version to App Review
        required: true
        type: string
      override_gate:
        description: Submit even if the build was never uploaded from this code.
        required: false
        type: boolean
        default: false
      override_device_pass:
        description: Submit even though nobody has run this build on a phone.
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: app-${{ inputs.slug }}
  cancel-in-progress: false

jobs:
  release:
    if: inputs.confirm == 'SUBMIT'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SLUG: ${{ inputs.slug }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BUNDLE_PREFIX: ${{ secrets.BUNDLE_PREFIX }}
      REVIEW_FIRST_NAME: ${{ secrets.REVIEW_FIRST_NAME }}
      REVIEW_LAST_NAME: ${{ secrets.REVIEW_LAST_NAME }}
      REVIEW_PHONE: ${{ secrets.REVIEW_PHONE }}
      REVIEW_EMAIL: ${{ secrets.REVIEW_EMAIL }}
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      FASTLANE_SKIP_UPDATE_CHECK: "1"
      FASTLANE_HIDE_CHANGELOG: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Submitting for review sends a build Apple already has. If the code has moved on
      # since that build was uploaded, the metadata about to be pushed describes an app
      # nobody shipped.
      - name: Refuse to submit a version that was never uploaded from this code
        run: |
          set -euo pipefail
          if .github/scripts/require-stage.sh "$SLUG" submit; then
            exit 0
          fi
          if [ "${{ inputs.override_gate }}" = "true" ]; then
            echo "::warning::The stage gate failed and override_gate was set. Submitting anyway."
            exit 0
          fi
          exit 1

      # The last gate before Apple, and the only one whose evidence a runner cannot produce.
      # It has its own override rather than riding on override_gate: the two refuse different
      # things, and a person skipping a phone test should have to say so in those words.
      - name: Refuse to submit a build nobody has run on a phone
        run: |
          set -euo pipefail
          if .github/scripts/require-device-pass.sh "$SLUG"; then
            exit 0
          fi
          if [ "${{ inputs.override_device_pass }}" = "true" ]; then
            echo "::warning::No device pass on record and override_device_pass was set. Submitting anyway."
            echo "⚠️ Submitted to App Review with no device pass on record, by explicit override." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "Run the TestFlight build on a phone, set \`device_tested\` (and \`storekit_verified\` if it sells) in apps/$SLUG/state.json, or dispatch again with override_device_pass." >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install fastlane
        run: gem install fastlane --no-document -v '~> 2.228'

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read the app's facts
        run: |
          set -euo pipefail
          {
            echo "SCHEME=$(node -p "require('./apps/$SLUG/qa.json').scheme")"
            echo "BUNDLE_ID=$(node -p "require('./apps/$SLUG/qa.json').bundleId")"
          } >> "$GITHUB_ENV"

      - name: Pre-flight the listing
        run: |
          set -euo pipefail
          m="apps/$SLUG/store/metadata/en-US"
          fail=0
          # Every localization Apple indexes on the US storefront, each inside its limits.
          .github/scripts/listing-check.sh "$SLUG" || fail=1

          # precheck rejects a version whose privacy or support URL 404s, and it does so after
          # the upload. Catch it here instead.
          for u in privacy_url support_url; do
            url=$(cat "$m/$u.txt")
            code=$(curl -s -o /dev/null -w '%{http_code}' -L "$url")
            if [ "$code" != "200" ]; then echo "::error::$u ($url) returned $code"; fail=1
            else echo "  $u: 200  $url"; fi
          done

          shots="apps/$SLUG/store/screenshots/en-US"
          n=$(ls "$shots"/*.png 2>/dev/null | wc -l | tr -d ' ')
          [ "$n" -ge 1 ] || { echo "::error::no screenshots in $shots"; fail=1; }
          echo "  screenshots: $n in en-US"

          exit $fail

      - name: App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          : "${ASC_KEY_P8:?ASC_KEY_P8 is not set; run tools/push-secrets.sh}"
          mkdir -p ~/.appstoreconnect && chmod 700 ~/.appstoreconnect
          printf '%s' "$ASC_KEY_P8" > ~/.appstoreconnect/AuthKey_${ASC_KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/AuthKey_${ASC_KEY_ID}.p8
          echo "ASC_KEY_PATH=$HOME/.appstoreconnect/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      # Read-only. A build Apple has not finished processing, a product missing from App Store
      # Connect or a missing release.json stops the run here, before the listing is touched.
      - name: What the release still lacks
        run: node tools/asc/release.mjs "$SLUG"

      - name: Push the listing
        run: |
          cd tools/fastlane
          APP_DIR="../../apps/$SLUG/ios" fastlane release

      - name: Submit for review, with the in-app purchases
        run: node tools/asc/release.mjs "$SLUG" --apply

      - name: Record the result
        if: always()
        run: |
          .github/scripts/record-stage.sh "$SLUG" release \
            "${{ job.status == 'success' && 'ok' || 'fail' }}"

      - name: Done
        if: success()
        run: echo "**${{ env.BUNDLE_ID }}** submitted. App Store Connect should read *Waiting for Review*." >> "$GITHUB_STEP_SUMMARY"
