name: claude-selftest

# Throwaway. Answers one question: does claude-code-action authenticate and answer at all
# on this repo, with this token? The prompt and its answer are trivial on purpose, because
# this repository is public and its logs are public with it.

on:
  workflow_dispatch:
    inputs:
      model:
        description: Model to try
        required: false
        type: string
        default: ""
      pass_args:
        description: Also pass the claude_args app-build uses
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  # The action exchanges an OIDC token before it will talk to Anthropic at all, even when
  # authenticating with an OAuth token. Without this it dies before the first model call.
  id-token: write

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Shape only. A length, a prefix match and a whitespace flag say whether the secret was
      # pasted wrong or is a well-formed token Anthropic is rejecting — two different fixes —
      # and none of the three reveals anything. This repository is public; the value is not
      # printed and GitHub masks it regardless.
      - name: Is the token even shaped like a token
        env:
          T: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -uo pipefail
          if [ -z "${T:-}" ]; then echo "::error::the secret is empty"; exit 1; fi
          printf 'length: %s\n' "${#T}"
          case "$T" in
            sk-ant-oat01-*) echo "prefix: sk-ant-oat01- ✅ (what 'claude setup-token' emits)" ;;
            sk-ant-*)       echo "prefix: sk-ant-… but NOT sk-ant-oat01- — this looks like an API key, not a setup-token" ;;
            *)              echo "prefix: ❌ does not start with sk-ant- at all" ;;
          esac
          case "$T" in
            *[[:space:]]*) echo "::warning::the value contains whitespace — a stray newline or space came along with the paste" ;;
            *)             echo "whitespace: none ✅" ;;
          esac

      - name: Bare call, no claude_args
        if: ${{ !inputs.pass_args }}
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          prompt: "Reply with exactly: SELFTEST OK. Do not use any tools."
          claude_args: ${{ inputs.model != '' && format('--model {0}', inputs.model) || '' }}

      - name: With the args app-build passes
        if: ${{ inputs.pass_args }}
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          prompt: "Reply with exactly: SELFTEST OK. Do not use any tools."
          claude_args: >-
            --max-turns 3
            --model ${{ inputs.model != '' && inputs.model || 'claude-opus-5' }}
            --allowedTools "Read,Glob,Grep"
