<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Crosshatch · the line</title>
<style>
  :root {
    --canvas: #96A199; --surface: #F3EDDC; --ink: #15191A; --inkSoft: #2F3634;
    --accent: #10525C; --highlight: #9E4E17; --success: #286554;
    --prussian:#1D4468; --sanguine:#8E3A33; --bistre:#6E5416; --payne:#3B454C;
    --caps: ui-monospace, "SF Mono", Menlo, monospace;
    --display: ui-serif, "New York", Georgia, serif;
    --body: -apple-system, "SF Pro Text", system-ui, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
  html, body { width: 440px; height: 956px; overflow: hidden; }
  body { background: var(--canvas); font-family: var(--body); color: var(--ink); position: relative; }

  .glow { position: absolute; inset: 0;
    background: radial-gradient(circle 620px at 78% 5%, #B4BEB3 0%, rgba(180,190,179,0) 70%); }
  .tooth { position: absolute; inset: 0;
    background: repeating-linear-gradient(62deg, rgba(21,25,26,.034) 0 1px, transparent 1px 3.5px); }
  .tooth.cross { background: repeating-linear-gradient(-62deg, rgba(21,25,26,.034) 0 1px, transparent 1px 3.5px);
    -webkit-mask-image: radial-gradient(ellipse 430px 470px at 2% 98%, #000 0%, transparent 76%); }

  .status { position: absolute; top: 0; left: 0; right: 0; height: var(--safe-top, 62px);
    display: flex; align-items: flex-end; justify-content: space-between;
    padding: 0 30px 11px; font: 600 16px/1 var(--body); z-index: 40; }
  .status .r { display: flex; gap: 6px; align-items: center; }

  .nav { position: absolute; top: var(--safe-top, 62px); left: 0; right: 0; height: 52px; z-index: 30;
    display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }
  .nav .t { font: 700 32px/1 var(--display); letter-spacing: -.6px; }
  .nav .share { color: var(--accent); }

  .rail { position: absolute; left: 0; right: 0; height: 2px; background: rgba(21,25,26,.13); z-index: 2; }
  .rail::after { content: ""; position: absolute; left: 0; right: 0; height: 1px; background: rgba(158,78,23,.22); }
  .rail.top { top: 130px; } .rail.top::after { bottom: -1px; }
  .rail.bot { bottom: 96px; } .rail.bot::after { top: -1px; }

  /* the hero: the only number in the app that only ever goes up */
  .heroCap { position: absolute; top: 150px; left: 0; right: 0; text-align: center; z-index: 5;
    font: 700 8px/1.9 var(--caps); letter-spacing: 3.4px; text-transform: uppercase; color: rgba(47,54,52,.66); }
  .hero { position: absolute; top: 162px; left: 0; right: 0; text-align: center; z-index: 5;
    font: 700 108px/1 var(--display); letter-spacing: -4px; color: var(--ink); }

  /* the drying line: prints pegged on a cord, newest at the left */
  .cord { position: absolute; top: 258px; left: 0; right: 0; height: 2px; z-index: 6;
    background: linear-gradient(90deg, rgba(158,78,23,.15), rgba(158,78,23,.7) 12%, rgba(158,78,23,.7) 88%, rgba(158,78,23,.15)); }
  .line { position: absolute; top: 250px; left: 0; right: 0; height: 160px; z-index: 7;
    display: flex; gap: 10px; padding-left: 18px; align-items: flex-start; }
  .sheet { position: relative; flex: 0 0 auto; width: 92px; height: 126px; background: var(--surface);
    border-radius: 2px; padding: 16px 7px 0;
    box-shadow: 0 7px 16px rgba(21,25,26,.24), 0 1px 0 rgba(255,255,255,.6) inset; }
  .sheet .peg { position: absolute; left: 50%; top: -6px; transform: translateX(-50%); }
  .sheet .marks { display: flex; flex-wrap: wrap; gap: 2px; justify-content: center; margin-top: 4px; }
  .sheet .d { position: absolute; left: 0; right: 0; bottom: 7px; text-align: center;
    font: 700 6.5px/1.6 var(--caps); letter-spacing: 1.2px; text-transform: uppercase; color: rgba(47,54,52,.62); }

  /* today, on the bed */
  .today { position: absolute; top: 424px; left: 16px; right: 16px; z-index: 8; display: flex;
    align-items: center; gap: 13px; background: var(--surface); border-radius: 3px; padding: 12px 14px;
    box-shadow: 0 8px 20px rgba(21,25,26,.18), 0 1px 0 rgba(255,255,255,.6) inset; }
  .today .chip { flex: 0 0 auto; width: 58px; height: 44px; border-radius: 2px;
    background: linear-gradient(150deg, #E0A05E, #BE7A36);
    border-bottom: 2px solid #7A4415; border-right: 2px solid #7A4415; position: relative; overflow: hidden; }
  .today .k { font: 700 7.5px/1.8 var(--caps); letter-spacing: 1.7px; text-transform: uppercase; color: rgba(47,54,52,.66); }
  .today .s { font: 600 16px/1.2 var(--display); margin-top: 1px; }
  .today .go { margin-left: auto; background: var(--accent); color: var(--surface); border-radius: 20px;
    padding: 10px 16px; font: 600 14px/1 var(--body); white-space: nowrap; }

  /* the day-book: a printed page, one square a day */
  .book { position: absolute; top: 512px; left: 16px; right: 16px; z-index: 8;
    background: var(--surface); border-radius: 3px; padding: 14px 16px 16px;
    box-shadow: 0 9px 22px rgba(21,25,26,.18), 0 1px 0 rgba(255,255,255,.6) inset; }
  .book .head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 9px; }
  .book .m { font: 600 17px/1 var(--display); }
  .book .k { font: 700 7.5px/1.8 var(--caps); letter-spacing: 1.7px; text-transform: uppercase; color: rgba(47,54,52,.62); }
  .dow { display: grid; grid-template-columns: repeat(7, 1fr); margin-bottom: 5px; }
  .dow span { text-align: center; font: 700 6.5px/1.8 var(--caps); letter-spacing: 1.1px;
    text-transform: uppercase; color: rgba(47,54,52,.5); }
  .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
  .day { aspect-ratio: 1 / .82; border-radius: 1.5px; position: relative;
    box-shadow: inset 0 0 0 1px rgba(21,25,26,.15); display: flex; align-items: center; justify-content: center; }
  .foot { position: absolute; bottom: 116px; left: 0; right: 0; text-align: center; z-index: 8;
    font: 700 8px/1.9 var(--caps); letter-spacing: 2.2px; text-transform: uppercase; color: rgba(21,25,26,.62); }

  .tabbar { position: absolute; left: 0; right: 0; bottom: 0; height: calc(48px + var(--safe-bottom, 34px));
    background: rgba(243,237,220,.6); backdrop-filter: blur(22px) saturate(160%);
    border-top: .5px solid rgba(21,25,26,.15); display: flex; padding-bottom: var(--safe-bottom, 34px); z-index: 30; }
  .tabbar div { flex: 1; text-align: center; padding-top: 6px; font: 500 10px/1.8 var(--body); color: rgba(47,54,52,.62); }
  .tabbar div.on { color: var(--accent); }
  .tabbar svg { display: block; margin: 0 auto; }
</style>
</head>
<body>
  <div class="glow"></div><div class="tooth"></div><div class="tooth cross"></div>
  <div class="rail top"></div><div class="rail bot"></div>

  <svg width="0" height="0" style="position:absolute"><defs>
    <symbol id="m-ferry" viewBox="0 0 24 24"><g fill="none" stroke="#15191A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 15h19l-2.5 5H5Z"/><path d="M6 15V9.5h12V15"/><path d="M12 9.5V4.5"/></g></symbol>
    <symbol id="m-lamp" viewBox="0 0 24 24"><g fill="none" stroke="#15191A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 10h9l1.5 8.5H6Z"/><path d="M9.5 10 12 4l2.5 6"/></g></symbol>
    <symbol id="m-rope" viewBox="0 0 24 24"><g fill="none" stroke="#15191A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13.5" r="6"/><circle cx="12" cy="13.5" r="2.2"/><path d="M12 7.5V3.5"/></g></symbol>
    <symbol id="m-bell" viewBox="0 0 24 24"><g fill="none" stroke="#15191A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 17c2-2 2-4.5 2-7a4 4 0 0 1 8 0c0 2.5 0 5 2 7Z"/><path d="M10.5 20h3"/></g></symbol>
    <symbol id="m-key" viewBox="0 0 24 24"><g fill="none" stroke="#15191A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="4.2"/><path d="M11 11l8 8M16 16l-2.2 2.2M19 19l-2 2"/></g></symbol>
    <symbol id="m-fish" viewBox="0 0 24 24"><g fill="none" stroke="#15191A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12c4-5 11-5 15 0-4 5-11 5-15 0Z"/><path d="M18 12l3-3.5v7Z"/></g></symbol>
    <symbol id="m-moon" viewBox="0 0 24 24"><g fill="none" stroke="#15191A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 15.5A8 8 0 0 1 8.5 6a8 8 0 1 0 9.5 9.5Z"/></g></symbol>
    <symbol id="m-lock" viewBox="0 0 24 24"><g fill="none" stroke="#15191A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18h18M6 18V9h12v9"/><path d="M9 9V6h6v3"/></g></symbol>
    <symbol id="peg" viewBox="0 0 22 14"><path d="M1 7 Q11 1.6 21 7 Q11 12.4 1 7Z" fill="#9E4E17"/><path d="M11 7v6" stroke="#9E4E17" stroke-width="1.6"/></symbol>
  </defs></svg>

  <div class="heroCap">Plates pulled</div>
  <div class="hero">214</div>

  <div class="cord"></div>
  <div class="line" id="line"></div>

  <div class="today">
    <div class="chip"><canvas id="chip" width="116" height="88" style="width:58px;height:44px"></canvas></div>
    <div>
      <div class="k">Today · 17 September</div>
      <div class="s">The Six O'Clock Ferry</div>
    </div>
    <div class="go">Back to the bed</div>
  </div>

  <div class="book">
    <div class="head">
      <span class="m">September</span>
      <span class="k">Twenty-two inked</span>
    </div>
    <div class="dow"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div>
    <div class="days" id="days"></div>
  </div>

  <div class="foot">214 pulled · 31 days running · longest 58</div>

  <div class="status">
    <span>9:41</span>
    <span class="r">
      <svg width="17" height="11" viewBox="0 0 17 11"><g fill="#15191A"><rect y="7.5" width="3" height="3.5" rx=".7"/><rect x="4.5" y="5.5" width="3" height="5.5" rx=".7"/><rect x="9" y="3" width="3" height="8" rx=".7"/><rect x="13.5" width="3" height="11" rx=".7"/></g></svg>
      <svg width="16" height="11" viewBox="0 0 16 11"><path d="M8 9.6 5.2 6.7a4 4 0 0 1 5.6 0Z" fill="#15191A"/><path d="M2.8 4.3a7.4 7.4 0 0 1 10.4 0" stroke="#15191A" stroke-width="1.5" fill="none" stroke-linecap="round"/><path d="M.6 1.6a10.6 10.6 0 0 1 14.8 0" stroke="#15191A" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>
      <svg width="25" height="11" viewBox="0 0 25 11"><rect x=".5" y=".5" width="20" height="10" rx="2.8" fill="none" stroke="#15191A" opacity=".45"/><rect x="2" y="2" width="15" height="7" rx="1.6" fill="#15191A"/><path d="M22.2 3.6v3.8a2.2 2.2 0 0 0 0-3.8Z" fill="#15191A" opacity=".45"/></svg>
    </span>
  </div>

  <div class="nav">
    <span class="t">The line</span>
    <span class="share"><svg width="22" height="24" viewBox="0 0 22 24" fill="none" stroke="#10525C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 15V2.5"/><path d="M6.5 7 11 2.5 15.5 7"/><path d="M4 11.5H2.5v10h17v-10H18"/></svg></span>
  </div>

  <div class="tabbar">
    <div><svg width="24" height="20" viewBox="0 0 24 20"><rect x="2.4" y="2" width="19.2" height="16" rx="1" fill="none" stroke="#2F3634" stroke-width="1.6" opacity=".7"/><g stroke="#2F3634" stroke-width="1.3" opacity=".55"><path d="M5.4 14.6 10 10M8 14.6 12.6 10M5.4 9.6 10 14.2M8 9.6 12.6 14.2"/></g><path d="M14.2 10 Q17.4 7.8 20.6 10 Q17.4 12.2 14.2 10Z" fill="#2F3634" opacity=".7"/></svg>Bed</div>
    <div class="on"><svg width="24" height="20" viewBox="0 0 24 20" fill="none" stroke="#10525C" stroke-width="1.6"><path d="M1.5 4h21"/><rect x="3.5" y="4" width="7" height="10" rx=".8"/><rect x="13.5" y="4" width="7" height="13" rx=".8"/></svg>Line</div>
    <div><svg width="24" height="20" viewBox="0 0 24 20" fill="none" stroke="#2F3634" stroke-width="1.6" opacity=".7"><rect x="2.5" y="3" width="4.6" height="15" rx=".8"/><rect x="9.7" y="3" width="4.6" height="15" rx=".8"/><rect x="16.9" y="3" width="4.6" height="15" rx=".8"/></svg>Run</div>
    <div><svg width="24" height="20" viewBox="0 0 24 20" fill="none" stroke="#2F3634" stroke-width="1.6" opacity=".7"><circle cx="12" cy="10" r="3.4"/><path d="M12 .8v3M12 16.2v3M2.8 10h3M18.2 10h3M5.5 3.5l2.1 2.1M16.4 14.4l2.1 2.1M18.5 3.5l-2.1 2.1M7.6 14.4l-2.1 2.1"/></svg>Shop</div>
  </div>

<script>
// The drying line: the last prints pulled, newest at the left, each on its day's stock.
const sheets = [
  { d: '17 Sept', stock: '#F6F1E1', marks: ['m-ferry', 'm-lamp', 'm-rope', 'm-bell'] },
  { d: '16 Sept', stock: '#F3EDDC', marks: ['m-key', 'm-fish', 'm-moon', 'm-lock'] },
  { d: '15 Sept', stock: '#EFE9D6', marks: ['m-bell', 'm-rope', 'm-ferry', 'm-key'] },
  { d: '14 Sept', stock: '#F4EEDE', marks: ['m-moon', 'm-lock', 'm-fish', 'm-lamp'] },
  { d: '12 Sept', stock: '#F1EBD9', marks: ['m-lamp', 'm-key', 'm-bell', 'm-ferry'] },
];
document.getElementById('line').innerHTML = sheets.map((s, i) =>
  '<div class="sheet" style="background:' + s.stock + '; transform: rotate(' + (i % 2 ? .9 : -1.1) + 'deg)">' +
  '<svg class="peg" width="20" height="13" viewBox="0 0 22 14"><use href="#peg"/></svg>' +
  '<div class="marks">' + s.marks.map(m =>
    '<svg width="34" height="34" viewBox="0 0 24 24"><use href="#' + m + '"/></svg>').join('') + '</div>' +
  '<div class="d">' + s.d + '</div></div>').join('');

// The day-book page: one square a day. Inked in that plate's lead ink when it was pulled,
// the registration cross on today, and a day missed is simply an empty square.
const inks = ['#9E4E17', '#1D4468', '#286554', '#8E3A33', '#6E5416', '#3B454C'];
// September 2026 starts on a Tuesday, so one blank leads the month.
const pulled = new Set([1,2,3,4,5,6,8,9,10,11,12,14,15,16,17,19,20,22,23,24,26,27]);
let out = '<div></div>';
for (let d = 1; d <= 30; d++) {
  if (d === 17) {
    out += '<div class="day" style="box-shadow: inset 0 0 0 1.4px #10525C">' +
      '<svg width="15" height="15" viewBox="0 0 15 15"><g stroke="#10525C" stroke-width="1.3" fill="none">' +
      '<path d="M7.5 1v13M1 7.5h13"/><circle cx="7.5" cy="7.5" r="3.4" stroke-width="1"/></g></svg></div>';
  } else if (pulled.has(d)) {
    out += '<div class="day"><svg width="17" height="11" viewBox="0 0 17 11">' +
      '<path d="M1 5.5 Q8.5 1 16 5.5 Q8.5 10 1 5.5Z" fill="' + inks[d % 6] + '"/></svg></div>';
  } else {
    out += '<div class="day"></div>';
  }
}
document.getElementById('days').innerHTML = out;

// Today's plate, part cut, as a chip of copper
(function () {
  const c = document.getElementById('chip').getContext('2d');
  c.scale(2, 2);
  const CELL = 7;
  for (let r = 0; r < 6; r++) for (let col = 0; col < 8; col++) {
    const x = col * CELL + 1, y = r * CELL + 1;
    c.strokeStyle = 'rgba(21,25,26,.22)'; c.lineWidth = .5; c.strokeRect(x, y, CELL, CELL);
    if ((r * 3 + col * 5) % 7 < 3) {
      c.save(); c.beginPath(); c.rect(x, y, CELL, CELL); c.clip();
      c.fillStyle = 'rgba(21,25,26,.1)'; c.fillRect(x, y, CELL, CELL);
      c.strokeStyle = 'rgba(21,25,26,.8)'; c.lineWidth = .8;
      for (let k = -3; k < 4; k++) {
        c.beginPath(); c.moveTo(x - 4, y + k * 2.6 + 4); c.lineTo(x + 12, y + k * 2.6 - 12); c.stroke();
        c.beginPath(); c.moveTo(x - 4, y + k * 2.6 - 3); c.lineTo(x + 12, y + k * 2.6 + 13); c.stroke();
      }
      c.restore();
    } else if ((r + col) % 5 === 0) {
      c.beginPath();
      c.moveTo(x + 1, y + CELL / 2);
      c.quadraticCurveTo(x + CELL / 2, y + CELL / 2 - 2, x + CELL - 1, y + CELL / 2);
      c.quadraticCurveTo(x + CELL / 2, y + CELL / 2 + 2, x + 1, y + CELL / 2);
      c.fillStyle = '#190D03'; c.fill();
    }
  }
})();
</script>
</body>
</html>
