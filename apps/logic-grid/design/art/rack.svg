  <!-- the bed rail below, so the line is hanging in a room -->
  <rect x="0" y="152" width="400" height="2.6" fill="#15191A" fill-opacity=".12"/>
  <rect x="0" y="152" width="400" height="1" fill="#9E4E17" fill-opacity=".22"/>
