<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 166" width="400" height="166">
  <defs>
    <linearGradient id="cord" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9E4E17" stop-opacity=".2"/>
      <stop offset=".1" stop-color="#9E4E17"/><stop offset=".9" stop-color="#9E4E17"/>
      <stop offset="1" stop-color="#9E4E17" stop-opacity=".2"/>
    </linearGradient>
    <filter id="sheetDrop" x="-40%" y="-20%" width="180%" height="160%">
      <feDropShadow dx="-3" dy="7" stdDeviation="6" flood-color="#15191A" flood-opacity=".3"/>
    </filter>
    <g id="mk" fill="none" stroke="#15191A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  </defs>

  <!-- the cord, strung across the shop -->
  <path d="M6 56 Q200 66 394 56" fill="none" stroke="url(#cord)" stroke-width="3"/>

  <g filter="url(#sheetDrop)">
