        <path d="M34 22a5 3 0 0 1 10 0v5"/><path d="M32 29h14"/>
        <path d="M13 48c3-3 3-6 3-9a5 5 0 0 1 10 0c0 3 0 6 3 9Z"/><path d="M18 52h6"/>
        <circle cx="39" cy="44" r="6"/><circle cx="39" cy="44" r="2.2"/>
      </g>
      <path d="M8 64h42" stroke="#15191A" stroke-opacity=".2" stroke-width=".8"/>
      <text x="29" y="74" font-family="ui-monospace, monospace" font-size="6.2" font-weight="700"
