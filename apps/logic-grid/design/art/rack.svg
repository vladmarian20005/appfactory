        <path d="M13 22 21 30M21 22 13 30" stroke-opacity="0"/>
        <path d="M12 30h16l-2 4H14Z"/><path d="M20 30V20l5 8"/>
        <circle cx="39" cy="26" r="6"/><path d="M39 21v5l3 2"/>
        <path d="M11 52c4-5 12-5 16 0-4 5-12 5-16 0Z"/><path d="M27 52l3-3v6Z"/>
        <path d="M46 48a6 6 0 0 1-8-8 6.5 6.5 0 1 0 8 8Z"/>
