  <!-- the pegs: the app's own lozenge, in copper -->
  <g fill="#9E4E17">
    <g transform="translate(43 53)"><path d="M-11 4 Q0 -2 11 4 Q0 10 -11 4Z"/><rect x="-1.4" y="4" width="2.8" height="9" rx="1"/></g>
