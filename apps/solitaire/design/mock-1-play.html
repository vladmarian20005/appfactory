<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Baize · the table</title>
<style>
  :root {
    --canvas: #34547A; --surface: #5E4432; --ink: #F4ECDC; --inkSoft: #D2C8B2;
    --accent: #D9B35C; --onAccent: #241A10; --highlight: #FBB9A9; --success: #A6D6AD; --miss: #B7CADD;
    --stock: #F6EFE0; --cardInk: #1E2532; --lamp: #F3C37A; --brassDeep: #A47E35;
    --display: ui-serif, "New York", Georgia, serif;
    --body: -apple-system, "SF Pro Text", system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
  html, body { width: 440px; height: 956px; overflow: hidden; }
  body { background: var(--canvas); font-family: var(--body); color: var(--ink); position: relative; }
  .glow { position: absolute; inset: 0;
    background: radial-gradient(circle 520px at 12% 2%, rgba(75,110,150,1) 0%, rgba(75,110,150,0) 70%); }
  .nap { position: absolute; inset: 0; opacity: .5; }
  .status { position: absolute; top: 0; left: 0; right: 0; height: var(--safe-top, 62px);
    display: flex; align-items: flex-end; justify-content: space-between;
    padding: 0 30px 11px; font: 600 16px/1 var(--body); z-index: 40; color: var(--ink); }
  .status .r { display: flex; gap: 6px; align-items: center; }
  .nav { position: absolute; top: 0; left: 0; right: 0; height: 104px; z-index: 30;
    background: rgba(52,84,122,.5); backdrop-filter: blur(22px) saturate(160%);
    border-bottom: .5px solid rgba(244,236,220,.14);
    display: flex; align-items: flex-end; padding: 0 16px 9px; }
  .nav .l, .nav .menu { width: 62px; display: flex; align-items: center; }
  .nav .menu { justify-content: flex-end; }
  .nav .title { flex: 1; text-align: center; font: 600 17px/1 var(--display); }
  .tabbar { position: absolute; left: 0; right: 0; bottom: 0; height: calc(48px + var(--safe-bottom, 34px));
    background: rgba(52,84,122,.5); backdrop-filter: blur(22px) saturate(160%);
    border-top: .5px solid rgba(244,236,220,.14); display: flex; padding-bottom: var(--safe-bottom, 34px); z-index: 30; }
  .tabbar div { flex: 1; text-align: center; padding-top: 6px; font: 500 10px/1.8 var(--body); color: rgba(210,200,178,.7); }
  .tabbar div.on { color: var(--accent); }
  .tabbar svg { display: block; margin: 0 auto; }

  .edge { position: absolute; left: 0; right: 0; height: 6px; background: var(--surface); box-shadow: 0 1px 0 rgba(255,255,255,.08) inset; }
  .edge.top { top: 104px; } .edge.bottom { bottom: 82px; box-shadow: 0 -1px 0 rgba(255,255,255,.08) inset; }
  .corner { position: absolute; width: 14px; height: 14px; }
  .caps { font: 600 10.5px/1.6 var(--body); letter-spacing: 2px; text-transform: uppercase; color: var(--inkSoft); }
  .head { position: absolute; left: 20px; right: 20px; top: 124px; display: flex; justify-content: space-between; align-items: flex-start; white-space: nowrap; }
  .head .num { display: flex; align-items: baseline; gap: 8px; margin-top: 2px; }
  .head .num b { font: 600 34px/1 var(--display); color: var(--ink); letter-spacing: -.5px; }
  .head .right { text-align: right; }
  .head .ok { color: var(--success); }

  #table { position: absolute; left: 0; top: 0; width: 440px; height: 956px; overflow: visible; }
  .foot { position: absolute; left: 20px; right: 20px; bottom: 100px; text-align: center; }
  .foot .say { font: italic 400 15px/1.4 var(--body); color: var(--inkSoft); min-height: 21px; }
  .foot .seed { margin-top: 8px; font: 500 11px/1 var(--mono); letter-spacing: 1.5px; color: rgba(210,200,178,.75); }
</style>
</head>
<body>
  <div class="glow"></div>
  <svg class="nap" id="nap"></svg>

  <div class="edge top"></div>
  <div class="edge bottom"></div>

  <div class="head">
    <div>
      <div class="caps">Today · Monday 12 October</div>
      <div class="num"><b>41</b><span class="caps">moves</span></div>
    </div>
    <div class="right">
      <div class="caps">Draw one · Grade 1</div>
      <div class="caps">The mark 147</div>
      <div class="caps ok">Clean · 9 up</div>
    </div>
  </div>

  <svg id="table" viewBox="0 0 440 956"></svg>

  <div class="foot">
    <div class="say"></div>
    <div class="seed">№ 285 · 2026-10-12 · 7C3A-19B2</div>
  </div>

  <div class="status">
    <span>9:41</span>
    <span class="r">
      <svg width="17" height="11" viewBox="0 0 17 11"><g fill="#F4ECDC"><rect y="7.5" width="3" height="3.5" rx=".7"/><rect x="4.5" y="5.5" width="3" height="5.5" rx=".7"/><rect x="9" y="3" width="3" height="8" rx=".7"/><rect x="13.5" width="3" height="11" rx=".7"/></g></svg>
      <svg width="16" height="11" viewBox="0 0 16 11"><path d="M8 9.6 5.2 6.7a4 4 0 0 1 5.6 0Z" fill="#F4ECDC"/><path d="M2.8 4.3a7.4 7.4 0 0 1 10.4 0" stroke="#F4ECDC" stroke-width="1.5" fill="none" stroke-linecap="round"/><path d="M.6 1.6a10.6 10.6 0 0 1 14.8 0" stroke="#F4ECDC" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>
      <svg width="25" height="11" viewBox="0 0 25 11"><rect x=".5" y=".5" width="20" height="10" rx="2.8" fill="none" stroke="#F4ECDC" opacity=".45"/><rect x="2" y="2" width="15" height="7" rx="1.6" fill="#F4ECDC"/><path d="M22.2 3.6v3.8a2.2 2.2 0 0 0 0-3.8Z" fill="#F4ECDC" opacity=".45"/></svg>
    </span>
  </div>
  <div class="nav">
    <span class="l"><svg width="22" height="20" viewBox="0 0 22 20" fill="none" stroke="#D9B35C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4 3 8l4 4"/><path d="M3 8h10a6 6 0 0 1 0 12H9"/></svg></span>
    <span class="title">Today</span>
    <span class="menu"><svg width="22" height="22" viewBox="0 0 22 22" fill="#D9B35C"><circle cx="4" cy="11" r="2"/><circle cx="11" cy="11" r="2"/><circle cx="18" cy="11" r="2"/></svg></span>
  </div>

  <div class="tabbar">
    <div class="on"><svg width="26" height="20" viewBox="0 0 26 20" fill="none" stroke="#D9B35C" stroke-width="1.6"><rect x="3" y="2" width="9" height="13" rx="1.6"/><rect x="14" y="5" width="9" height="13" rx="1.6"/></svg>Table</div>
    <div><svg width="26" height="20" viewBox="0 0 26 20" fill="none" stroke="#D2C8B2" stroke-width="1.6" opacity=".75"><rect x="4" y="2" width="18" height="16" rx="2"/><path d="M4 7h18M9 2v16"/></svg>Diary</div>
    <div><svg width="26" height="20" viewBox="0 0 26 20" fill="none" stroke="#D2C8B2" stroke-width="1.6" opacity=".75"><rect x="3" y="6" width="20" height="11" rx="2"/><path d="M10 11.5h6M3 6l3-4h14l3 4"/></svg>Drawer</div>
  </div>

<script src="cards.js"></script>
<script>
  const { card, nap, defs, COL, pip } = Cards;
  document.getElementById('nap').innerHTML = nap(0, 0, 440, 956, 7, 0.06, 3);

  const W = 54, H = W * 1.4, X = i => 12 + i * 60, TOP = 200, TAB = 296;
  const out = [defs];
  // stock, waste
  out.push(card({ x: X(0), y: TOP, w: W, face: false }));
  out.push(card({ x: X(1), y: TOP, w: W, rank: '4', suit: 'D' }));
  // foundations: spades to 3, hearts to 2, clubs to 4, diamonds empty — nine up
  out.push(card({ x: X(3), y: TOP, w: W, rank: '3', suit: 'S' }));
  out.push(card({ x: X(4), y: TOP, w: W, rank: '2', suit: 'H' }));
  out.push(card({ x: X(5), y: TOP, w: W, rank: '4', suit: 'C' }));
  out.push(`<rect x="${X(6) + .5}" y="${TOP + .5}" width="${W - 1}" height="${H - 1}" rx="${W * .08}" fill="none" stroke="${COL.stock}" stroke-opacity=".16"/>` +
    pip('D', X(6) + W * .3, TOP + H / 2 - W * .2, W * .4, COL.stock).replace('fill="#F6EFE0"', 'fill="#F6EFE0" fill-opacity=".18"'));
  // tableau, mid-deal: fifteen cards still face down, one long run built on column 3
  const cols = [
    [[null,null,0],[null,null,0],['9','D',1],['8','S',1],['7','H',1],['6','C',1]],
    [[null,null,0],['K','C',1],['Q','H',1]],
    [['10','D',1],['9','S',1],['8','D',1],['7','S',1],['6','D',1],['5','S',1],['4','H',1]],
    [[null,null,0],[null,null,0],[null,null,0],['Q','D',1],['J','S',1],['10','H',1]],
    [[null,null,0],[null,null,0],[null,null,0],[null,null,0],['J','C',1]],
    [['K','H',1],['Q','S',1]],
    [[null,null,0],[null,null,0],[null,null,0],[null,null,0],[null,null,0],['8','H',1],['7','C',1]],
  ];
  cols.forEach((col, i) => {
    let y = TAB;
    col.forEach(([rank, suit, up], k) => {
      const nudge = i === 5 ? 3 : 0;
      out.push(card({ x: X(i), y: y + nudge, w: W, rank, suit, face: !!up, shadow: 1 }));
      y += up ? 21 : 8;
    });
  });
  // the drop ghost on column 5, where the run will land
  out.push(`<rect x="${X(5)}" y="${TAB + 45}" width="${W}" height="${H}" rx="${W * .08}" fill="${COL.stock}" fill-opacity=".22"/>`);
  // the run in the hand: J♦ 10♠ 9♥, lifted 4%, bending
  const rx = X(5) - 10, ry = TAB + 96;
  out.push(`<g transform="translate(${rx} ${ry}) scale(1.04)">`);
  out.push(card({ x: 0, y: 0, w: W, rank: 'J', suit: 'D', shadow: 9 }));
  out.push(card({ x: 1.5, y: 23, w: W, rank: '10', suit: 'S', rot: 1.6, shadow: 9 }));
  out.push(card({ x: 4, y: 46, w: W, rank: '9', suit: 'H', rot: 3.4, shadow: 9 }));
  out.push(`</g>`);
  document.getElementById('table').innerHTML = out.join('');

  // brass corners on the cloth
  const corner = (x, y, flip) => {
    const s = 14, t = 4;
    const d = flip ? `M${x} ${y} h${s} v${s} h-${t} v-${s - t} h-${s - t} z` : `M${x} ${y} h${s} v${t} h-${s - t} v${s - t} h-${t} z`;
    return `<path d="${d}" fill="#A47E35"/><path d="${d}" fill="#D9B35C" transform="translate(-1 -1)"/>`;
  };
  document.getElementById('table').innerHTML += corner(12, 114, false) + corner(414, 846, true);
</script>
</body>
</html>
