<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 300" fill="none">
  <!-- Tidepour · onboarding 3 — "Nothing here runs out."
       The flat running out to the horizon with a line of lit vials receding, no end drawn. -->
  <defs>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFEFD6" stop-opacity=".85"/><stop offset="1" stop-color="#FFD2A0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="seaFar" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8FB8BE" stop-opacity=".68"/>
      <stop offset=".6" stop-color="#9FC3C8" stop-opacity=".34"/>
      <stop offset="1" stop-color="#9FC3C8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="flat3" cx="50%" cy="36%" r="58%">
      <stop offset="0" stop-color="#E5D6BC" stop-opacity=".95"/>
      <stop offset=".55" stop-color="#D6C6AA" stop-opacity=".68"/>
      <stop offset="1" stop-color="#CCBCA2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skyFade3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFD2A0" stop-opacity="0"/><stop offset=".32" stop-color="#FFD2A0" stop-opacity=".8"/>
      <stop offset=".68" stop-color="#FFD2A0" stop-opacity=".8"/><stop offset="1" stop-color="#FFD2A0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="oGlass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F4FCFB" stop-opacity=".46"/>
      <stop offset=".42" stop-color="#DCF0EE" stop-opacity=".10"/>
      <stop offset="1" stop-color="#F4FCFB" stop-opacity=".30"/>
    </linearGradient>
    <filter id="oGlow" x="-90%" y="-90%" width="280%" height="280%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <circle cx="212" cy="76" r="52" fill="url(#moonGlow)"/>
  <circle cx="212" cy="76" r="14" fill="#FFF3E0"/>
  <ellipse cx="190" cy="116" rx="196" ry="26" fill="url(#seaFar)"/>
  <path d="M14 104h352" stroke="url(#skyFade3)" stroke-width="1.6"/>
  <ellipse cx="190" cy="228" rx="184" ry="66" fill="url(#flat3)"/>
  <!-- the light on the wet flat, running toward the viewer -->
  <path d="M206 106 L262 290 L150 290 Z" fill="#FFD2A0" opacity=".18" filter="url(#oGlow)"/>
  <g stroke="#FFFFFF" stroke-opacity=".3" stroke-width="1.3" stroke-linecap="round">
    <path d="M48 146h40"/><path d="M292 140h50"/><path d="M60 182h28"/><path d="M300 190h44"/>
  </g>

  <!-- the line of vials, nearest first, each smaller and dimmer than the last -->
  <!-- 1 · nearest, ember -->
  <ellipse cx="86" cy="250" rx="34" ry="9" fill="#D9542A" opacity=".26" filter="url(#oGlow)"/>
  <path d="M62 186a9 9 0 0 1 9-9h30a9 9 0 0 1 9 9v56a24 24 0 0 1-48 0z" stroke="#1E4C55" stroke-opacity=".2" stroke-width="4"/>
  <path d="M62 210h48v32a24 24 0 0 1-48 0z" fill="#E8622F"/>
  <path d="M62 186a9 9 0 0 1 9-9h30a9 9 0 0 1 9 9v56a24 24 0 0 1-48 0z" fill="url(#oGlass)" stroke="#EAF7F5" stroke-width="2.3"/>
  <path d="M70 192v46" stroke="#FFFFFF" stroke-opacity=".6" stroke-width="2.5" stroke-linecap="round"/>

  <!-- 2 · lantern -->
  <ellipse cx="152" cy="238" rx="27" ry="7" fill="#D89A20" opacity=".24" filter="url(#oGlow)"/>
  <path d="M133 186a7 7 0 0 1 7-7h24a7 7 0 0 1 7 7v44a19 19 0 0 1-38 0z" stroke="#1E4C55" stroke-opacity=".18" stroke-width="3.4"/>
  <path d="M133 200h38v30a19 19 0 0 1-38 0z" fill="#EBAC29"/>
  <path d="M133 186a7 7 0 0 1 7-7h24a7 7 0 0 1 7 7v44a19 19 0 0 1-38 0z" fill="url(#oGlass)" stroke="#EAF7F5" stroke-opacity=".9" stroke-width="2"/>

  <!-- 3 · kelp -->
  <ellipse cx="206" cy="228" rx="21" ry="6" fill="#23976F" opacity=".22" filter="url(#oGlow)"/>
  <path d="M191 188a6 6 0 0 1 6-6h18a6 6 0 0 1 6 6v34a15 15 0 0 1-30 0z" stroke="#1E4C55" stroke-opacity=".16" stroke-width="3"/>
  <path d="M191 198h30v24a15 15 0 0 1-30 0z" fill="#2CA57C"/>
  <path d="M191 188a6 6 0 0 1 6-6h18a6 6 0 0 1 6 6v34a15 15 0 0 1-30 0z" fill="url(#oGlass)" stroke="#EAF7F5" stroke-opacity=".8" stroke-width="1.8"/>

  <!-- 4 · tide -->
  <ellipse cx="250" cy="220" rx="16" ry="5" fill="#2276B8" opacity=".2" filter="url(#oGlow)"/>
  <path d="M239 190a5 5 0 0 1 5-5h14a5 5 0 0 1 5 5v26a12 12 0 0 1-24 0z" stroke="#1E4C55" stroke-opacity=".14" stroke-width="2.6"/>
  <path d="M239 198h24v18a12 12 0 0 1-24 0z" fill="#2E82C2"/>
  <path d="M239 190a5 5 0 0 1 5-5h14a5 5 0 0 1 5 5v26a12 12 0 0 1-24 0z" fill="url(#oGlass)" stroke="#EAF7F5" stroke-opacity=".7" stroke-width="1.6"/>

  <!-- 5, 6 · almost gone -->
  <ellipse cx="286" cy="214" rx="12" ry="4" fill="#7A5CCD" opacity=".18" filter="url(#oGlow)"/>
  <path d="M278 193a4 4 0 0 1 4-4h9a4 4 0 0 1 4 4v18a8.5 8.5 0 0 1-17 0z" fill="#8A6BD8" fill-opacity=".7" stroke="#EAF7F5" stroke-opacity=".55" stroke-width="1.4"/>
  <path d="M310 196a3 3 0 0 1 3-3h7a3 3 0 0 1 3 3v13a6.5 6.5 0 0 1-13 0z" fill="#D8597B" fill-opacity=".5" stroke="#EAF7F5" stroke-opacity=".4" stroke-width="1.2"/>

  <!-- motes coming off the water -->
  <g fill="#FFD79E">
    <circle cx="112" cy="152" r="2.4" opacity=".8"/><circle cx="264" cy="164" r="2" opacity=".6"/>
    <circle cx="330" cy="176" r="2.6" opacity=".5"/><circle cx="52" cy="206" r="2" opacity=".55"/>
  </g>
</svg>
