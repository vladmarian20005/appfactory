<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tidepour · play</title>
<style>
  :root{
    --ink:#E8F4F2; --inkSoft:#9DBAC0; --surface:#10323C;
    --accent:#4FE3D2; --onAccent:#062A2B; --highlight:#FFB27A;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased}
  html,body{width:440px;height:956px;overflow:hidden}
  body{
    font-family:-apple-system,"SF Pro Text",system-ui,sans-serif;color:var(--ink);position:relative;
    background:
      radial-gradient(120% 30% at 50% 20%, rgba(255,178,122,.12) 0%, rgba(255,178,122,0) 70%),
      radial-gradient(150% 60% at 50% 116%, #06323D 0%, rgba(6,50,61,0) 62%),
      linear-gradient(174deg,#132C3A 0%,#0C2A36 24%,#092630 50%,#072330 74%,#041F29 100%);
  }
  /* the last of the light, low on the water */
  .horizon{position:absolute;left:0;right:0;top:238px;height:2px;z-index:1;
    background:linear-gradient(90deg,rgba(255,201,77,0),rgba(255,201,77,.34) 22%,rgba(255,224,168,.5) 50%,rgba(255,201,77,.34) 78%,rgba(255,201,77,0));
    filter:blur(.6px)}
  .glowband{position:absolute;left:0;right:0;top:176px;height:96px;z-index:0;
    background:linear-gradient(180deg,rgba(255,178,122,0),rgba(255,178,122,.09) 62%,rgba(255,201,77,.13) 82%,rgba(255,178,122,0));
    filter:blur(6px)}
  .mote{position:absolute;border-radius:50%;z-index:2}

  /* wet flats: two shelves the racks stand on */
  .shelf{position:absolute;left:0;right:0;z-index:2}
  .shelf .sheen{position:absolute;left:14%;right:14%;top:0;height:1px;
    background:linear-gradient(90deg,rgba(214,240,238,0),rgba(214,240,238,.26) 34%,rgba(214,240,238,.26) 66%,rgba(214,240,238,0));
    filter:blur(.4px)}
  .shelf .wash{position:absolute;left:0;right:0;top:0;height:64px;
    background:radial-gradient(76% 100% at 50% 0%,rgba(190,222,220,.075),rgba(190,222,220,0) 78%)}

  .status{height:var(--safe-top,62px);display:flex;align-items:flex-end;justify-content:space-between;
    padding:0 28px 8px;font-size:15px;font-weight:600;position:relative;z-index:9}
  .status .right{display:flex;gap:6px;align-items:center}
  .nav{height:44px;display:flex;align-items:center;justify-content:center;position:relative;z-index:9}
  .nav .title{font-family:ui-serif,"New York",Georgia,serif;font-weight:600;font-size:17px}

  /* ── the tide mark ───────────────────────────────────────────── */
  .mark{position:absolute;left:26px;right:26px;top:116px;z-index:8}
  .mark .n{font-family:ui-serif,"New York",Georgia,serif;font-weight:600;font-size:58px;line-height:.9;
    font-variant-numeric:tabular-nums;letter-spacing:-2px;
    text-shadow:0 0 28px rgba(79,227,210,.28)}
  .mark .line{margin-top:18px;height:14px;position:relative}
  .mark .rule{position:absolute;left:0;right:0;top:6px;height:1.5px;border-radius:2px;background:rgba(157,186,192,.28)}
  .mark .filled{position:absolute;left:0;width:54%;top:6px;height:1.5px;border-radius:2px;
    background:linear-gradient(90deg,rgba(79,227,210,.25),var(--accent))}
  .mark .par{position:absolute;right:0;top:0;width:1.5px;height:14px;border-radius:2px;background:var(--highlight)}
  .mark .you{position:absolute;left:54%;top:.5px;width:13px;height:13px;margin-left:-6.5px;border-radius:50%;
    background:var(--accent);box-shadow:0 0 18px rgba(79,227,210,.85),0 0 3px rgba(255,255,255,.75)}
  .mark .labels{display:flex;justify-content:space-between;margin-top:10px;font-size:11px;letter-spacing:1.5px;
    text-transform:uppercase}
  .mark .labels .l{color:var(--inkSoft)}
  .mark .labels .r{color:var(--highlight)}

  /* ── vials ───────────────────────────────────────────────────── */
  .vial{position:absolute;z-index:5}
  .glass{position:absolute;inset:0;border-radius:15px 15px 28px 28px;overflow:hidden;
    background:linear-gradient(100deg,rgba(226,242,240,.13),rgba(226,242,240,.035) 40%,rgba(226,242,240,.10));
    box-shadow:inset 0 0 0 1.5px rgba(216,238,236,.30), inset 0 -14px 22px rgba(0,0,0,.30), inset 0 8px 14px rgba(0,0,0,.18)}
  .glass::after{content:"";position:absolute;left:7px;top:11px;width:4.5px;bottom:18px;border-radius:4px;
    background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,.05));filter:blur(.5px)}
  .fill{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column-reverse}
  .u{position:relative;width:100%}
  .u+.u::after{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:rgba(0,0,0,.20)}
  .u.top::before{content:"";position:absolute;left:0;right:0;top:-1px;height:4px;border-radius:50%;
    background:rgba(255,255,255,.32);filter:blur(1px)}
  .halo{position:absolute;left:-18px;right:-18px;top:-8px;bottom:-18px;border-radius:30px;z-index:-1;filter:blur(17px)}
  .pool{position:absolute;left:50%;transform:translateX(-50%);border-radius:50%;filter:blur(8px);z-index:-1}
  /* the vial's reflection in the wet flat */
  .refl{position:absolute;left:0;right:0;transform:scaleY(-1);opacity:.22;filter:blur(1.6px);
    -webkit-mask-image:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.9));z-index:3;pointer-events:none}

  .e-ember   {background:linear-gradient(180deg,#FF8A57,#D9542A)}
  .e-tide    {background:linear-gradient(180deg,#5CB2F0,#2276B8)}
  .e-lantern {background:linear-gradient(180deg,#FFD265,#D89A20)}
  .e-kelp    {background:linear-gradient(180deg,#5FD8A9,#23976F)}
  .e-dusk    {background:linear-gradient(180deg,#B69AF5,#7457C9)}
  .e-coral   {background:linear-gradient(180deg,#FF93AC,#D45577)}

  .anemone{position:absolute;left:50%;transform:translateX(-50%);width:76px;height:34px;z-index:6}
  .ring{position:absolute;left:50%;transform:translateX(-50%);border-radius:50%;z-index:4}

  .chartlabel{position:absolute;z-index:8;font-family:ui-serif,"New York",Georgia,serif;font-style:italic;
    font-size:13px;color:var(--accent);letter-spacing:.4px;text-shadow:0 0 14px rgba(79,227,210,.5)}

  /* ── controls ────────────────────────────────────────────────── */
  .controls{position:absolute;left:22px;right:22px;bottom:112px;display:flex;gap:11px;z-index:8}
  .ctl{flex:1;height:50px;border-radius:25px;display:flex;align-items:center;justify-content:center;gap:7px;
    font-size:15.5px;font-weight:500;color:var(--ink);
    background:rgba(226,242,240,.10);backdrop-filter:blur(18px);
    box-shadow:inset 0 0 0 .5px rgba(226,242,240,.22),0 2px 14px rgba(0,0,0,.30)}
  .ctl.dim{color:rgba(226,242,240,.34)}

  .tabs{position:absolute;left:0;right:0;bottom:0;height:83px;display:flex;align-items:flex-start;padding-top:9px;
    background:rgba(7,30,40,.74);backdrop-filter:blur(24px);
    box-shadow:inset 0 .5px 0 rgba(226,242,240,.13);z-index:9}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:rgba(157,186,192,.7)}
  .tab.on{color:var(--accent)}
  .home{position:absolute;left:50%;transform:translateX(-50%);bottom:9px;width:140px;height:5px;
    border-radius:3px;background:rgba(226,242,240,.42);z-index:10}
</style>
</head>
<body>
  <div class="glowband"></div>
  <div class="horizon"></div>

  <div class="mote" style="left:58px;top:352px;width:3px;height:3px;background:rgba(214,245,240,.7);box-shadow:0 0 9px rgba(79,227,210,.6)"></div>
  <div class="mote" style="left:388px;top:296px;width:2.5px;height:2.5px;background:rgba(214,245,240,.55);box-shadow:0 0 8px rgba(79,227,210,.5)"></div>
  <div class="mote" style="left:300px;top:624px;width:3px;height:3px;background:rgba(255,201,77,.6);box-shadow:0 0 9px rgba(255,201,77,.5)"></div>
  <div class="mote" style="left:96px;top:756px;width:2.5px;height:2.5px;background:rgba(214,245,240,.5);box-shadow:0 0 8px rgba(79,227,210,.45)"></div>

  <div class="status">
    <div>9:41</div>
    <div class="right">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="#E8F4F2"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
      <svg width="17" height="12" viewBox="0 0 17 12" fill="#E8F4F2"><path d="M8.5 11.4 6.2 8.9a3.4 3.4 0 0 1 4.6 0zM3.6 6.2 1.9 4.4a9.6 9.6 0 0 1 13.2 0l-1.7 1.8a7.2 7.2 0 0 0-9.8 0z"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12"><rect x="0.5" y="0.5" width="20" height="11" rx="3.2" fill="none" stroke="#E8F4F2" stroke-opacity=".5"/><rect x="2.2" y="2.2" width="14" height="7.6" rx="1.8" fill="#E8F4F2"/><path d="M22.2 4.2v3.6a2 2 0 0 0 0-3.6z" fill="#E8F4F2" fill-opacity=".5"/></svg>
    </div>
  </div>

  <div class="nav"><div class="title">Level 34</div></div>

  <div class="mark">

    <div class="line">
      <div class="rule"></div><div class="filled"></div><div class="par"></div><div class="you"></div>
    </div>
    <div class="labels"><div class="l">poured</div><div class="r">the line · 13</div></div>
  </div>

  <!-- ── back shelf, further up the beach ───────────────────────── -->
  <div class="shelf" style="top:452px"><div class="sheen"></div><div class="wash"></div></div>

  <!-- back row: 4 vials, w 56, h 152 (38 × 4), bottoms at 452, centres 92 / 170 / 248 / 326 -->
  <div class="vial" style="left:64px;top:300px;width:56px;height:152px">
    <div class="halo" style="background:radial-gradient(50% 50% at 50% 62%,rgba(255,201,77,.30),rgba(255,201,77,0) 70%)"></div>
    <div class="pool" style="bottom:-12px;width:104px;height:26px;background:rgba(255,201,77,.30)"></div>
    <div class="glass"><div class="fill">
      <div class="u e-lantern" style="height:38px"></div><div class="u e-lantern" style="height:38px"></div>

    </div></div>

    <svg class="anemone" viewBox="0 0 76 34" fill="none" style="bottom:-26px;width:66px;height:30px">
      <g stroke="#FFC94D" stroke-width="2.3" stroke-linecap="round" opacity=".85">
        <path d="M38 30c-5-4-8-11-8-16"/><path d="M38 30c5-4 8-11 8-16"/>
        <path d="M38 30c-9-2-15-7-18-11"/><path d="M38 30c9-2 15-7 18-11"/><path d="M38 30V13"/></g>
    </svg>
  </div>
  <div class="vial" style="left:142px;top:300px;width:56px;height:152px">
    <div class="glass"><div class="fill">
      <div class="u e-tide" style="height:38px"></div><div class="u e-coral" style="height:38px"></div>
      <div class="u e-tide top" style="height:38px"></div>
    </div></div>
  </div>
  <div class="vial" style="left:220px;top:300px;width:56px;height:152px">
    <div class="glass"><div class="fill">
      <div class="u e-dusk" style="height:38px"></div><div class="u e-kelp" style="height:38px"></div>
      <div class="u e-kelp top" style="height:38px"></div>
    </div></div>
  </div>
  <div class="vial" style="left:298px;top:300px;width:56px;height:152px">
    <div class="glass" style="box-shadow:inset 0 0 0 1.5px rgba(216,238,236,.40), inset 0 -14px 22px rgba(0,0,0,.22)"><div class="fill"></div></div>
  </div>

  <!-- reflections, back row -->
  <div class="refl" style="left:64px;top:452px;width:56px;height:76px">
    <div style="position:absolute;inset:0;border-radius:15px 15px 28px 28px;background:linear-gradient(180deg,#FFD265,#D89A20)"></div>
  </div>
  <div class="refl" style="left:142px;top:452px;width:56px;height:58px">
    <div style="position:absolute;inset:0;border-radius:15px 15px 28px 28px;background:linear-gradient(180deg,#5CB2F0,#2276B8)"></div>
  </div>
  <div class="refl" style="left:220px;top:452px;width:56px;height:58px">
    <div style="position:absolute;inset:0;border-radius:15px 15px 28px 28px;background:linear-gradient(180deg,#5FD8A9,#23976F)"></div>
  </div>

  <!-- the charted line: the next move after this one -->
  <svg style="position:absolute;left:0;top:250px;width:440px;height:300px;z-index:7" viewBox="0 0 440 300" fill="none">
    <defs><filter id="sg" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>
    <path d="M170 48 C 196 -2, 300 -2, 326 44" stroke="#4FE3D2" stroke-opacity=".6" stroke-width="2"
          stroke-dasharray="3 8" stroke-linecap="round" filter="url(#sg)"/>
    <path d="M320 30 l9 15 -17 2z" fill="#4FE3D2" fill-opacity=".75" filter="url(#sg)"/>
  </svg>
  <div class="chartlabel" style="left:186px;top:258px">the charted line</div>

  <!-- ── front shelf ────────────────────────────────────────────── -->
  <div class="shelf" style="top:748px"><div class="sheen"></div><div class="wash"></div></div>

  <!-- front row: 4 vials, w 62, h 184 (46 × 4), bottoms at 748, centres 94 / 178 / 262 / 346 -->
  <div class="vial" style="left:63px;top:564px;width:62px;height:184px">
    <div class="halo" style="background:radial-gradient(50% 50% at 50% 62%,rgba(79,209,160,.34),rgba(79,209,160,0) 70%)"></div>
    <div class="pool" style="bottom:-14px;width:120px;height:30px;background:rgba(79,209,160,.32)"></div>
    <div class="glass"><div class="fill">
      <div class="u e-kelp" style="height:46px"></div><div class="u e-kelp" style="height:46px"></div>
      <div class="u e-kelp" style="height:46px"></div><div class="u e-kelp top" style="height:46px"></div>
    </div></div>
    <div class="ring" style="bottom:-13px;width:136px;height:34px;border:1.5px solid rgba(79,209,160,.36)"></div>
    <svg class="anemone" viewBox="0 0 76 34" fill="none" style="bottom:-30px">
      <g stroke="#4FD1A0" stroke-width="2.5" stroke-linecap="round" opacity=".88">
        <path d="M38 30c-5-4-8-11-8-16"/><path d="M38 30c5-4 8-11 8-16"/>
        <path d="M38 30c-9-2-15-7-18-11"/><path d="M38 30c9-2 15-7 18-11"/><path d="M38 30V13"/></g>
    </svg>
  </div>
  <!-- the source: emptied by two, still holding two -->
  <div class="vial" style="left:147px;top:564px;width:62px;height:184px">
    <div class="glass"><div class="fill">
      <div class="u e-coral" style="height:46px"></div><div class="u e-dusk top" style="height:46px"></div>
    </div></div>
  </div>
  <!-- the destination: the ember level is climbing -->
  <div class="vial" style="left:231px;top:564px;width:62px;height:184px">
    <div class="halo" style="background:radial-gradient(50% 50% at 50% 70%,rgba(255,122,69,.34),rgba(255,122,69,0) 70%)"></div>
    <div class="glass" style="box-shadow:inset 0 0 0 2px rgba(255,150,105,.60), inset 0 -14px 22px rgba(0,0,0,.26)"><div class="fill">
      <div class="u e-ember" style="height:46px"></div><div class="u e-ember" style="height:46px"></div>
      <div class="u e-ember top" style="height:46px"></div>
    </div></div>
  </div>
  <div class="vial" style="left:315px;top:564px;width:62px;height:184px">
    <div class="glass"><div class="fill">
      <div class="u e-tide" style="height:46px"></div><div class="u e-coral top" style="height:46px"></div>
    </div></div>
  </div>

  <!-- reflections, front row -->
  <div class="refl" style="left:63px;top:748px;width:62px;height:92px">
    <div style="position:absolute;inset:0;border-radius:15px 15px 28px 28px;background:linear-gradient(180deg,#5FD8A9,#23976F)"></div>
  </div>
  <div class="refl" style="left:147px;top:748px;width:62px;height:46px">
    <div style="position:absolute;inset:0;border-radius:15px 15px 28px 28px;background:linear-gradient(180deg,#B69AF5,#7457C9)"></div>
  </div>
  <div class="refl" style="left:231px;top:748px;width:62px;height:70px">
    <div style="position:absolute;inset:0;border-radius:15px 15px 28px 28px;background:linear-gradient(180deg,#FF8A57,#D9542A)"></div>
  </div>
  <div class="refl" style="left:315px;top:748px;width:62px;height:46px">
    <div style="position:absolute;inset:0;border-radius:15px 15px 28px 28px;background:linear-gradient(180deg,#FF93AC,#D45577)"></div>
  </div>

  <!-- ── the pour in flight ─────────────────────────────────────── -->
  <!-- source lifted out of the sand and tipped to 112°: the liquid runs to the lip -->
  <div class="vial" style="left:112px;top:410px;width:62px;height:184px;transform:rotate(112deg);z-index:6">
    <div class="halo" style="background:radial-gradient(50% 50% at 50% 30%,rgba(255,122,69,.32),rgba(255,122,69,0) 70%)"></div>
    <div class="glass" style="box-shadow:inset 0 0 0 2px rgba(255,255,255,.46), inset 0 14px 22px rgba(0,0,0,.20)">
      <!-- tipped, so the fill hangs from the mouth end instead of the foot -->
      <div class="fill" style="bottom:auto;top:0;flex-direction:column">
        <div class="u e-ember top" style="height:46px"></div><div class="u e-ember" style="height:46px"></div>
      </div>
    </div>
  </div>

  <svg style="position:absolute;left:0;top:0;width:440px;height:956px;z-index:7" viewBox="0 0 440 956" fill="none">
    <defs>
      <filter id="streamglow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="7"/></filter>
      <linearGradient id="sgr" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#FFC7A2"/><stop offset=".45" stop-color="#FF8A57"/><stop offset="1" stop-color="#EE6A34"/>
      </linearGradient>
    </defs>
    <!-- the ribbon: wide at the lip, thinning as it falls into the mouth -->

    <path d="M235 535 C 245 557, 255 581, 262 606 L258 607 C 251 582, 241 558, 229 539 Z" fill="url(#sgr)"/>
    <!-- the surface it is landing on catches the light -->
    <ellipse cx="262" cy="612" rx="28" ry="7" fill="#FFB58C" opacity=".5" filter="url(#streamglow)"/>
    <ellipse cx="262" cy="611" rx="20" ry="3.6" fill="#FFDFCB" opacity=".85"/>
    <circle cx="274" cy="592" r="2.4" fill="#FFC49E" opacity=".9"/>

  <div class="controls">
    <div class="ctl dim">

      Back
    </div>

    </div>
    <div class="ctl">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#E8F4F2" stroke-width="1.7" stroke-linecap="round"><path d="M14 8a6 6 0 1 1-1.9-4.4"/><path d="M14 1.4V4h-2.6"/></svg>
      Refill
    </div>
  </div>

  <div class="tabs">
    <div class="tab on">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="#4FE3D2"><path d="M12 3c3.4 4.2 5.6 7.3 5.6 10a5.6 5.6 0 1 1-11.2 0C6.4 10.3 8.6 7.2 12 3z"/></svg>
      Pour
    </div>
    <div class="tab">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="rgba(157,186,192,.7)" stroke-width="1.7" stroke-linecap="round"><path d="M3 17.5h18"/><path d="M6 17.5v-5M10 17.5V7.5M14 17.5v-8M18 17.5V5.5"/></svg>
      Chart
    </div>
    <div class="tab">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="rgba(157,186,192,.7)" stroke-width="1.7"><rect x="3.2" y="4" width="5.2" height="16" rx="2.4"/><rect x="9.6" y="4" width="5.2" height="16" rx="2.4"/><rect x="16" y="4" width="5.2" height="16" rx="2.4"/></svg>
      Shore
