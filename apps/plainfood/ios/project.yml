name: Plainfood
options:
  bundleIdPrefix: com.factory
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
packages:
  FactoryKit:
    path: ../../../FactoryKit
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    INFOPLIST_KEY_CFBundleDisplayName: "Plainfood"
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
    INFOPLIST_KEY_NSCameraUsageDescription: "Plainfood uses the camera to scan food barcodes."
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
targets:
  Plainfood:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: FactoryKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.factory.plainfood
schemes:
  Plainfood:
    build:
      targets:
        Plainfood: all
    run:
      config: Debug
      storeKitConfiguration: App/Products.storekit
