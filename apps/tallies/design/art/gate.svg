<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <!-- A single five-bar gate cut deep into ash, the stroke landing, a shaving
       curling off it. Onboarding 2, the ledger's empty state. -->
  <defs>
    <linearGradient id="g-ash2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCF7EA"/><stop offset=".36" stop-color="#F0E5CC"/>
      <stop offset="1" stop-color="#DEC9A0"/>
    </linearGradient>
    <linearGradient id="g-edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B99A66"/><stop offset="1" stop-color="#7E6338"/>
    </linearGradient>
    <linearGradient id="g-vee" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D8BC8A"/><stop offset=".38" stop-color="#8A6A3C"/>
      <stop offset=".47" stop-color="#3E2C14"/><stop offset="1" stop-color="#1A1207"/>
    </linearGradient>
  </defs>

  <g transform="rotate(-2.4 200 150)">
    <!-- the board's thickness, and its face -->
    <rect x="-20" y="222" width="440" height="26" rx="8" fill="url(#g-edge)"/>
    <rect x="-20" y="58" width="440" height="170" rx="6" fill="url(#g-ash2)"/>

    <!-- grain -->
    <g stroke="#9A7542" stroke-opacity=".14" stroke-width="2.4" stroke-linecap="round">
      <path d="M30 190h330M10 210h250"/>
    </g>
    <g stroke="#9A7542" stroke-opacity=".08" stroke-width="1.8" stroke-linecap="round">
      <path d="M60 176h300M100 200h270"/>
    </g>

    <!-- the shoulder's lip, drawn before the cuts so every cut breaks it -->
    <rect x="-20" y="58" width="440" height="4.5" fill="#221A0F" fill-opacity=".26"/>
    <rect x="-20" y="62" width="440" height="2.4" fill="#FFFFFF" fill-opacity=".38"/>

    <!-- four uprights, cut in from the shoulder -->
    <g fill="url(#g-vee)">
      <path d="M86 58h40l-20 108z"/>
      <path d="M140 58h40l-20 108z"/>
      <path d="M194 58h40l-20 108z"/>
      <path d="M248 58h40l-20 108z"/>
    </g>

    <!-- the stroke across them, still being cut: it stops short of the fourth -->
    <g transform="rotate(8 190 120)">
      <rect x="74" y="106" width="176" height="5" fill="#FFFFFF" fill-opacity=".44"/>
      <rect x="74" y="110" width="176" height="15" fill="#3A2A12"/>
      <rect x="74" y="117" width="176" height="8" fill="#170F05"/>
    </g>
  </g>

  <!-- the shaving lifting off the shoulder, where the last cut was taken -->
  <g transform="translate(296 -4)">
    <path d="M0 56c-4-24 13-42 33-40 18 2 26 17 19 28-6 10-20 11-25 3-4-8 2-14 10-13
             -5 4 0 10 5 8 6-3 4-11-4-13-12-3-21 10-18 27z"
          fill="#F8F1DF" stroke="#221A0F" stroke-opacity=".14" stroke-width="1.2"/>
    <path d="M0 56c-4-24 13-42 33-40 5 1 9 2 12 4-20 0-34 15-33 36z" fill="#DCC79E"/>
  </g>
</svg>
