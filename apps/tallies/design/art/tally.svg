<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- The five-bar gate as a tab-bar glyph: four uprights and the stroke across them, the
       app's own mark rather than a stack of rectangles. Rendered as a template image, so the
       tab bar tints it the way it tints every other item. -->
  <g fill="#000000">
    <rect x="14" y="22" width="8" height="56" rx="2"/>
    <rect x="32" y="22" width="8" height="56" rx="2"/>
    <rect x="50" y="22" width="8" height="56" rx="2"/>
    <rect x="68" y="22" width="8" height="56" rx="2"/>
    <rect x="6" y="44" width="82" height="8" rx="3" transform="rotate(-19 47 48)"/>
  </g>
</svg>
