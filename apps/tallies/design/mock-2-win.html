<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tallies · the stave is scored (dark)</title>
<style>
  :root{
    --canvas:#13161A; --surface:#262117; --ink:#F1E7D3; --inkSoft:#A79C87;
    --accent:#6FBADD; --highlight:#F0885F; --success:#6FC0A0; --wax:#9B8E76;
    --ash-lit:#473C27; --ash-shade:#191409; --cut:#0D0A06;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
  html,body{width:440px;height:956px;overflow:hidden}
  body{background:var(--canvas);color:var(--ink);position:relative;
    font-family:-apple-system,"SF Pro Text",system-ui,sans-serif}
  /* the clipped lamp: the only light in the room */
  .glow{position:absolute;inset:0;
    background:radial-gradient(circle 660px at 28% 6%, #232A30 0%, rgba(35,42,48,0) 70%)}
  .wash{position:absolute;inset:0;opacity:.55;
    background:
      repeating-linear-gradient(2.4deg, rgba(255,255,255,.030) 0 1px, transparent 1px 7px),
      repeating-linear-gradient(-1.6deg, rgba(255,255,255,.020) 0 1px, transparent 1px 11px)}
  .display{font-family:-apple-system,"SF Pro Display",system-ui;font-weight:860;font-stretch:75%;
    letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .caps{font-family:ui-monospace,"SF Mono",monospace;text-transform:uppercase;
    letter-spacing:2.6px;font-size:10.5px;color:var(--inkSoft)}
  .wood{
    background-image:
      repeating-linear-gradient(0.7deg, rgba(255,231,190,.075) 0 1px, transparent 1px 6px),
      repeating-linear-gradient(-0.45deg, rgba(255,231,190,.045) 0 2px, transparent 2px 15px),
      radial-gradient(ellipse 90px 26px at 62% 62%, rgba(0,0,0,.28), rgba(0,0,0,0) 70%),
      linear-gradient(177deg, var(--ash-lit) 0%, var(--surface) 44%, var(--ash-shade) 100%);
  }

  .status{position:absolute;top:0;left:0;right:0;height:var(--safe-top,62px);
    display:flex;align-items:flex-end;justify-content:space-between;
    padding:0 30px 12px;font-size:15px;font-weight:600}
  .statusR{display:flex;align-items:center;gap:6px}
  .bars{display:flex;align-items:flex-end;gap:2px;height:11px}
  .bars i{width:3px;background:var(--ink);border-radius:1px}
  .bars i:nth-child(1){height:4px}.bars i:nth-child(2){height:6px}
  .bars i:nth-child(3){height:8.5px}.bars i:nth-child(4){height:11px}
  .batt{width:25px;height:12px;border:1.2px solid var(--ink);border-radius:3.5px;position:relative;opacity:.9}
  .batt::after{content:'';position:absolute;inset:1.8px;width:13px;background:var(--ink);border-radius:1.5px}
  .navbar{position:absolute;top:var(--safe-top,62px);left:0;right:0;height:44px;
    display:flex;align-items:center;justify-content:space-between;padding:0 18px}
  .navTitle{font-size:17px;font-weight:600}
  .navSide{display:flex;align-items:center;gap:18px;width:74px}
  .navSide.r{justify-content:flex-end}
  .benchEdge{position:absolute;top:130px;left:0;right:0;height:4px;
    background:rgba(0,0,0,.42);border-top:1px solid rgba(240,136,95,.36)}

  /* the headline, struck in the keel */
  .headline{position:absolute;top:152px;left:24px;right:24px;
    font-size:30px;line-height:1.08;color:var(--highlight);
    font-family:ui-monospace,"SF Mono",monospace;font-weight:700;
    letter-spacing:1.4px;text-transform:uppercase;transform:rotate(-1.4deg)}

  /* the ghost numeral counting up behind the work */
  .ghost{position:absolute;top:236px;left:0;right:0;text-align:center;
    font-size:132px;line-height:1;color:rgba(240,136,95,.20)}

  /* ── the stave, lifting off the bench toward the rack ───── */
  .flight{position:absolute;top:300px;left:0;right:0;height:270px}
  .stave{position:absolute;left:42px;top:36px;width:356px;height:92px;border-radius:5px;
    transform:rotate(-14deg) scale(.97);transform-origin:50% 50%;
    border-bottom:2px solid rgba(0,0,0,.55);
    box-shadow:0 24px 38px rgba(0,0,0,.62), inset 0 1px 0 rgba(255,231,190,.18);
    overflow:hidden}
  .band{position:absolute;left:0;top:0;bottom:0;width:16px;background:var(--highlight);
    box-shadow:inset -2px 0 0 rgba(0,0,0,.35)}
  .name{position:absolute;left:30px;bottom:9px;font-size:20px;color:rgba(241,231,211,.46)}
  .shoulder{position:absolute;left:30px;right:56px;top:0;height:28px;display:flex;align-items:flex-start}
  .gate{position:relative;height:28px;margin-right:13px}
  .ups{display:flex;gap:6px}
  .notch{width:7px;height:23px;position:relative;
    clip-path:polygon(0 0,100% 0,52% 100%);
    background:linear-gradient(101deg,#8A7550 0 42%,#241C10 48%,var(--cut) 100%);
    box-shadow:0 -1px 0 rgba(0,0,0,.5)}
  .gate .cross{position:absolute;left:-2px;top:3px;width:38px;height:2.6px;border-radius:2px;
    background:linear-gradient(180deg,#6B5228,var(--cut));
    box-shadow:0 -1px 0 rgba(255,231,190,.22);
    transform:rotate(24deg);transform-origin:0 50%}
  /* the scoring cut: one stroke, corner to corner */
  /* the scoring cut is deep: only its upper lip catches the lamp */
  .score{position:absolute;left:16px;right:56px;top:40px;height:6px;border-radius:2px;
    background:linear-gradient(180deg,#3A2E1A 0 16%,#120D07 42%,var(--cut) 100%);
    box-shadow:0 -1.5px 0 rgba(255,231,190,.34), inset 0 -1px 0 rgba(255,231,190,.10);
    transform:rotate(-6.5deg)}
  /* the end-grain, dated */
  .endgrain{position:absolute;right:0;top:0;bottom:0;width:54px;
    background:linear-gradient(100deg,#5A4A30,#2C2416);
    border-left:1.5px solid rgba(0,0,0,.55);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
  .endgrain b{font-family:ui-monospace,monospace;font-size:13px;letter-spacing:1px;
    color:var(--highlight);font-weight:700}
  .endgrain i{font-family:ui-monospace,monospace;font-size:8px;letter-spacing:1.2px;
    color:rgba(241,231,211,.5);font-style:normal}
  .chip{position:absolute;border-radius:1px}

  /* ── the sitting card ───────────────────────────────────── */
  .sitting{position:absolute;top:560px;left:24px;right:24px;border-radius:5px;padding:13px 16px;
    border-bottom:2px solid rgba(0,0,0,.5);
    box-shadow:0 12px 22px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,231,190,.16)}
  .sitting p{font-size:17px;line-height:1.34;margin-top:6px;color:var(--ink)}
  .sitting .clean{color:var(--success)}

  /* ── the rack, one stave richer ─────────────────────────── */
  .kept{position:absolute;top:694px;left:24px}
  .rack{position:absolute;top:718px;left:24px;right:24px;height:104px}
  .rackRail{position:absolute;left:0;right:0;bottom:0;height:5px;border-radius:2.5px;
    background:linear-gradient(180deg,#F3CE86,#B98B2E)}
  .rackRail::before{content:'';position:absolute;left:0;right:0;top:-1px;height:1px;background:rgba(255,255,255,.4)}
  .staves{position:absolute;left:0;right:0;bottom:5px;height:96px;display:flex;align-items:flex-end;gap:10px}
  .rstave{width:20px;border-radius:3px 3px 0 0;position:relative;overflow:hidden;
    box-shadow:inset -1.5px 0 0 rgba(0,0,0,.5), 0 -1px 0 rgba(255,231,190,.14)}
  .rstave .end{position:absolute;left:0;right:0;top:0;height:8px;border-radius:3px 3px 0 0;
    box-shadow:inset 0 -1px 0 rgba(0,0,0,.35)}
  .rstave .sc{position:absolute;left:3px;right:3px;top:13px;bottom:5px;
    background:repeating-linear-gradient(180deg,rgba(0,0,0,.5) 0 2px,transparent 2px 8px)}
  .rstave .score2{position:absolute;left:-4px;right:-4px;top:30px;height:2.2px;border-radius:1px;
    background:rgba(0,0,0,.58);box-shadow:0 -1px 0 rgba(255,231,190,.2);transform:rotate(-70deg)}
  .rstave.new{box-shadow:inset -1.5px 0 0 rgba(0,0,0,.5), 0 0 20px rgba(240,136,95,.6)}

  .tabbar{position:absolute;left:0;right:0;bottom:0;height:calc(var(--safe-bottom,34px) + 49px);
    background:rgba(24,21,15,.78);backdrop-filter:blur(24px);
    border-top:.5px solid rgba(241,231,211,.16);display:flex;justify-content:space-around;padding-top:7px}
  .tab{display:flex;flex-direction:column;align-items:center;gap:4px;width:88px;font-size:10px;color:var(--inkSoft)}
  .tab.on{color:var(--accent)}
  .tabGlyph{height:20px;display:flex;align-items:center}
  .home{position:absolute;left:50%;transform:translateX(-50%);bottom:9px;
    width:140px;height:5px;border-radius:3px;background:rgba(241,231,211,.36)}
</style>
</head>
