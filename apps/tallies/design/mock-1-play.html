<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tallies · the face, mid-cut</title>
<style>
  :root{
    --canvas:#C3B9A3; --surface:#F0E5CC; --ink:#221A0F; --inkSoft:#4C4334;
    --accent:#17506A; --onAccent:#FFF3E8; --highlight:#A2361B;
    --success:#2C6650; --wax:#6B5C43;
    --ash-lit:#F8F1DF; --ash-shade:#D9C39A; --cut:#2A1F12;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
  html,body{width:440px;height:956px;overflow:hidden}
  body{background:var(--canvas);color:var(--ink);position:relative;
    font-family:-apple-system,"SF Pro Text",system-ui,sans-serif}
  .glow{position:absolute;inset:0;
    background:radial-gradient(circle 470px at 24% 2%, rgba(216,207,188,.62) 0%, rgba(216,207,188,0) 64%)}
  .wash{position:absolute;inset:0;opacity:.5;
    background:
      repeating-linear-gradient(2.4deg, rgba(34,26,15,.034) 0 1px, transparent 1px 7px),
      repeating-linear-gradient(-1.6deg, rgba(34,26,15,.024) 0 1px, transparent 1px 11px)}

  .display{font-family:-apple-system,"SF Pro Display",system-ui;font-weight:860;font-stretch:75%;
    letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .caps{font-family:ui-monospace,"SF Mono",monospace;text-transform:uppercase;
    letter-spacing:2.6px;font-size:10.5px;color:var(--inkSoft)}

  /* ── iOS chrome ─────────────────────────────────────────── */
  .status{position:absolute;top:0;left:0;right:0;height:var(--safe-top,62px);
    display:flex;align-items:flex-end;justify-content:space-between;
    padding:0 30px 12px;font-size:15px;font-weight:600}
  .statusR{display:flex;align-items:center;gap:6px}
  .bars{display:flex;align-items:flex-end;gap:2px;height:11px}
  .bars i{width:3px;background:var(--ink);border-radius:1px}
  .bars i:nth-child(1){height:4px}.bars i:nth-child(2){height:6px}
  .bars i:nth-child(3){height:8.5px}.bars i:nth-child(4){height:11px}
  .batt{width:25px;height:12px;border:1.2px solid var(--ink);border-radius:3.5px;position:relative;opacity:.9}
  .batt::after{content:'';position:absolute;inset:1.8px;width:13px;background:var(--ink);border-radius:1.5px}
  .navbar{position:absolute;top:var(--safe-top,62px);left:0;right:0;height:44px;
    display:flex;align-items:center;justify-content:space-between;padding:0 18px}
  .navTitle{font-size:17px;font-weight:600}
  .navSide{display:flex;align-items:center;gap:18px;width:74px}
  .navSide.r{justify-content:flex-end}
  .benchEdge{position:absolute;top:130px;left:0;right:0;height:4px;
    background:rgba(34,26,15,.13);border-top:1px solid rgba(162,54,27,.34)}

  /* ── the hero ───────────────────────────────────────────── */
  .hero{position:absolute;top:142px;left:24px;right:24px;display:flex;
    align-items:flex-end;justify-content:space-between}
  .total{font-size:116px;line-height:.86;color:var(--ink)}
  .heroR{text-align:right;padding-bottom:8px}
  .gauge{margin-top:8px;width:126px;height:11px;position:relative;
    background:rgba(34,26,15,.13);border-radius:1px;border-top:1.5px solid rgba(162,54,27,.45)}
  .gauge .fill{position:absolute;left:0;top:0;bottom:0;width:64%;background:var(--success)}
  .gauge .line{position:absolute;left:75%;top:-5px;bottom:-5px;width:2.5px;background:var(--accent)}
  .gauge i{position:absolute;top:0;height:5px;width:1px;background:rgba(34,26,15,.28)}

  /* ── wood ───────────────────────────────────────────────── */
  .wood{
    background-image:
      repeating-linear-gradient(0.7deg, rgba(106,74,42,.14) 0 1px, transparent 1px 6px),
      repeating-linear-gradient(-0.45deg, rgba(106,74,42,.08) 0 2px, transparent 2px 15px),
      radial-gradient(ellipse 90px 26px at 62% 62%, rgba(106,74,42,.20), rgba(106,74,42,0) 70%),
      linear-gradient(177deg, var(--ash-lit) 0%, var(--surface) 44%, var(--ash-shade) 100%);
  }

  /* ── the stave ──────────────────────────────────────────── */
  .staveWrap{position:absolute;top:286px;left:20px;right:20px;height:132px}
  .stave{position:absolute;left:0;top:16px;width:400px;height:94px;border-radius:5px;
    transform:rotate(2.5deg);transform-origin:0 50%;
    border-bottom:2px solid rgba(34,26,15,.40);
    box-shadow:0 12px 20px rgba(34,26,15,.22), inset 0 1px 0 rgba(255,255,255,.6);
    overflow:hidden}
  .band{position:absolute;left:0;top:0;bottom:0;width:17px;background:var(--highlight);
    box-shadow:inset -2px 0 0 rgba(34,26,15,.3), inset 0 1px 0 rgba(255,255,255,.25)}
  .name{position:absolute;left:32px;bottom:10px;font-size:23px;color:rgba(34,26,15,.60);
    text-shadow:0 1px 0 rgba(255,255,255,.45)}
  /* the shoulder: notches cut in from the top edge */
  .shoulder{position:absolute;left:32px;right:12px;top:0;height:30px;display:flex;align-items:flex-start}
  .gate{position:relative;height:30px;margin-right:19px}
  .ups{display:flex;gap:9px}
  .notch{width:9px;height:26px;position:relative;
    clip-path:polygon(0 0,100% 0,52% 100%);
    background:linear-gradient(101deg,#F9F3E3 0 44%,#6B5228 49%,var(--cut) 100%);
    box-shadow:0 -1px 0 rgba(34,26,15,.4)}
  .notch.wax{background:linear-gradient(101deg,#E8DCC2 0 44%,#9A8A6B 49%,var(--wax) 100%)}
  .notch.opening{height:14px}
  .gate .cross{position:absolute;left:-2px;top:3px;width:50px;height:3px;border-radius:2px;
    background:linear-gradient(180deg,#6B5228,var(--cut));
    box-shadow:0 -1px 0 rgba(255,255,255,.35);
    transform:rotate(23deg);transform-origin:0 50%}

  /* the chisel, resting at the next position: a wide flat blade is what
     makes it a chisel rather than a pen, so the blade is the widest part */
  .chisel{position:absolute;left:248px;top:-46px;width:80px;height:176px;
    transform:rotate(19deg);transform-origin:50% 100%;
    filter:drop-shadow(0 5px 8px rgba(34,26,15,.34))}
  .chisel .handle{position:absolute;left:29px;top:0;width:23px;height:64px;
    border-radius:11px 11px 3px 3px;
    background:linear-gradient(96deg,#D9BE8D 0 16%,#B08F58 48%,#7A5C33 100%)}
  .chisel .ferrule{position:absolute;left:26px;top:60px;width:29px;height:15px;border-radius:2px;
    background:linear-gradient(96deg,#F2D089 0 14%,#C9932F 46%,#7C5E12 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.45)}
  .chisel .tang{position:absolute;left:29px;top:73px;width:23px;height:16px;
    background:linear-gradient(96deg,#AEB6BC,#6E767D 60%,#959DA3);
    clip-path:polygon(0 0,100% 0,84% 100%,16% 100%)}
  .chisel .blade{position:absolute;left:20px;top:87px;width:41px;height:56px;
    background:linear-gradient(96deg,#E3E8EB 0 14%,#7E868D 46%,#AEB6BC 76%,#5C646A 100%);
    clip-path:polygon(0 0,100% 0,100% 64%,50% 100%,0 64%)}
  .chisel .bevel{position:absolute;left:20px;top:117px;width:41px;height:26px;
    background:linear-gradient(180deg,rgba(255,255,255,.62),rgba(255,255,255,.05));
    clip-path:polygon(0 0,100% 0,50% 100%)}

  .chip{position:absolute;border-radius:1px;box-shadow:0 1px 0 rgba(34,26,15,.14)}

  /* ── the strip: V-cuts hanging from a brass rule ────────── */
  .strip{position:absolute;top:440px;left:24px;right:24px;height:124px}
  .stripHead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px}
  .brassRule{position:absolute;left:0;right:0;top:26px;height:4px;border-radius:2px;
    background:linear-gradient(180deg,#E8C275,#8A6A16)}
  .brassRule::after{content:'';position:absolute;left:0;right:0;top:-1px;height:1px;background:rgba(255,255,255,.5)}
  .field{position:absolute;left:0;right:0;top:30px;height:74px;border-radius:0 0 4px 4px;overflow:hidden;
    border-bottom:2px solid rgba(34,26,15,.34);
    box-shadow:0 8px 14px rgba(34,26,15,.16), inset 0 -1px 0 rgba(34,26,15,.2)}
  .field.wood{background-blend-mode:normal}
  .cuts{position:absolute;left:0;right:0;top:0;height:74px;display:flex;justify-content:space-between;padding:0 3px}
  .cut{width:21px;position:relative}
  .cut span{position:absolute;left:0;top:0;width:21px;
    clip-path:polygon(0 0,100% 0,70% 100%,30% 100%);
    background:linear-gradient(101deg,#F9F3E3 0 34%,#6B5228 40%,var(--cut) 100%);
    box-shadow:0 -1px 0 rgba(34,26,15,.4)}
  .cut.today span{background:linear-gradient(101deg,#BFE0F0 0 34%,#2E6D8C 40%,#0F3B50 100%)}
  .cut.waxed span{background:linear-gradient(101deg,#F2EADA 0 34%,#A2937A 40%,#8C7C60 100%)}
  .stripCaps{position:absolute;left:0;right:0;top:110px;display:flex;justify-content:space-between}

  /* ── the reading, under the lamp ────────────────────────── */
  .lamp{position:absolute;top:580px;left:24px;right:24px;height:84px}
  .lampGlow{position:absolute;left:-60px;right:-60px;top:-64px;height:150px;pointer-events:none;
    background:radial-gradient(ellipse 170px 74px at 26% 44%, rgba(224,180,85,.34) 0%, rgba(224,180,85,.13) 42%, rgba(224,180,85,0) 72%)}
  .panel{position:absolute;inset:0;border-radius:5px;
    border-bottom:2px solid rgba(34,26,15,.32);
    box-shadow:0 8px 14px rgba(34,26,15,.16), inset 0 1px 0 rgba(255,255,255,.6);
    padding:12px 16px}
  .panel p{font-size:17px;line-height:1.3;margin-top:6px;color:var(--ink)}

  .kept{position:absolute;top:686px;left:24px}
  /* ── the rack ───────────────────────────────────────────── */
  .rack{position:absolute;top:706px;left:24px;right:24px;height:114px}
  .rackRail{position:absolute;left:0;right:0;bottom:0;height:5px;border-radius:2.5px;
    background:linear-gradient(180deg,#E8C275,#8A6A16)}
  .rackRail::before{content:'';position:absolute;left:0;right:0;top:-1px;height:1px;background:rgba(255,255,255,.5)}
  .staves{position:absolute;left:0;right:0;bottom:5px;height:98px;display:flex;align-items:flex-end;gap:10px}
  .rstave{width:20px;border-radius:3px 3px 0 0;position:relative;overflow:hidden;
    box-shadow:inset -1.5px 0 0 rgba(34,26,15,.22), 0 -1px 0 rgba(255,255,255,.55)}
  .rstave .end{position:absolute;left:0;right:0;top:0;height:8px;border-radius:3px 3px 0 0;
    box-shadow:inset 0 -1px 0 rgba(34,26,15,.28)}
  /* the gates cut down each standing stave, and the scoring stroke across it */
  .rstave .sc{position:absolute;left:3px;right:3px;top:13px;bottom:5px;
    background:repeating-linear-gradient(180deg,rgba(34,26,15,.40) 0 2px,transparent 2px 8px)}
  .rstave .score{position:absolute;left:-4px;right:-4px;top:30px;height:2.2px;border-radius:1px;
    background:rgba(34,26,15,.55);box-shadow:0 -1px 0 rgba(255,255,255,.35);
    transform:rotate(-70deg)}

  .tabbar{position:absolute;left:0;right:0;bottom:0;height:calc(var(--safe-bottom,34px) + 49px);
    background:rgba(240,229,204,.74);backdrop-filter:blur(24px);
    border-top:.5px solid rgba(34,26,15,.18);display:flex;justify-content:space-around;padding-top:7px}
  .tab{display:flex;flex-direction:column;align-items:center;gap:4px;width:88px;font-size:10px;color:var(--inkSoft)}
  .tab.on{color:var(--accent)}
  .tabGlyph{height:20px;display:flex;align-items:center}
  .home{position:absolute;left:50%;transform:translateX(-50%);bottom:9px;
    width:140px;height:5px;border-radius:3px;background:rgba(34,26,15,.34)}
</style>
</head>
<body>
  <div class="glow"></div><div class="wash"></div>

  <div class="status">
    <span>9:41</span>
    <span class="statusR"><span class="bars"><i></i><i></i><i></i><i></i></span>
      <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 10.6 5.4 8a3.7 3.7 0 0 1 5.2 0L8 10.6Zm-5.1-5.1a8.6 8.6 0 0 1 10.2 0l-1.5 1.5a6.5 6.5 0 0 0-7.2 0L2.9 5.5ZM.5 3.1a12 12 0 0 1 15 0l-1.5 1.5a9.9 9.9 0 0 0-12 0L.5 3.1Z" fill="#221A0F"/></svg>
      <span class="batt"></span></span>
  </div>

  <div class="navbar">
    <span class="navSide">
      <svg width="12" height="20" viewBox="0 0 12 20"><path d="M10 1 2 10l8 9" stroke="#17506A" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </span>
    <span class="navTitle">Pull-ups</span>
    <span class="navSide r">
      <svg width="17" height="20" viewBox="0 0 17 20"><path d="M8.5 1v12M8.5 1 4.6 5M8.5 1l3.9 4M2 11v7h13v-7" stroke="#17506A" stroke-width="1.9" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <svg width="19" height="6" viewBox="0 0 19 6"><circle cx="2.4" cy="3" r="2.2" fill="#17506A"/><circle cx="9.5" cy="3" r="2.2" fill="#17506A"/><circle cx="16.6" cy="3" r="2.2" fill="#17506A"/></svg>
    </span>
  </div>

  <div class="benchEdge"></div>

  <div class="hero">
    <span class="total display">247</span>
    <span class="heroR">
      <div class="caps">9 today · goal 12</div>
      <div class="gauge"><span class="fill"></span><span class="line"></span>
        <i style="left:16.6%"></i><i style="left:33.2%"></i><i style="left:49.8%"></i><i style="left:66.4%"></i><i style="left:83%"></i></div>
    </span>
  </div>

  <div class="staveWrap">
    <div class="stave wood">
      <span class="band"></span>
      <span class="name display">PULL-UPS</span>
      <div class="shoulder">
        <span class="gate"><span class="ups"><span class="notch"></span><span class="notch"></span><span class="notch"></span><span class="notch"></span></span><span class="cross"></span></span>
        <span class="gate"><span class="ups"><span class="notch"></span><span class="notch wax"></span><span class="notch"></span><span class="notch"></span></span><span class="cross"></span></span>

      </div>
    </div>
    <div class="chisel">
      <span class="handle"></span><span class="ferrule"></span><span class="blade"></span><span class="bevel"></span>
    </div>
    <span class="chip" style="left:322px;top:24px;width:11px;height:3px;background:#F8F1DF;transform:rotate(-34deg)"></span>
    <span class="chip" style="left:338px;top:8px;width:8px;height:2.5px;background:#E4D5B2;transform:rotate(-54deg)"></span>
    <span class="chip" style="left:306px;top:6px;width:13px;height:3.5px;background:#F8F1DF;transform:rotate(-19deg)"></span>
    <span class="chip" style="left:352px;top:30px;width:7px;height:2.5px;background:#C8A778;transform:rotate(-66deg)"></span>
    <span class="chip" style="left:330px;top:46px;width:9px;height:2.5px;background:#E4D5B2;transform:rotate(-9deg)"></span>
    <span class="chip" style="left:296px;top:20px;width:7px;height:2.5px;background:#F8F1DF;transform:rotate(-45deg)"></span>
    <span class="chip" style="left:362px;top:14px;width:10px;height:3px;background:#E4D5B2;transform:rotate(-28deg)"></span>
  </div>

  <div class="strip">
    <div class="stripHead"><span class="caps">Last 14 days</span><span class="caps">9 today</span></div>
    <div class="brassRule"></div>
    <div class="field wood">
      <div class="cuts">
        <span class="cut"><span style="height:22px"></span></span>
        <span class="cut"><span style="height:34px"></span></span>
        <span class="cut"><span style="height:10px"></span></span>
        <span class="cut"><span style="height:43px"></span></span>
        <span class="cut"><span style="height:28px"></span></span>
        <span class="cut"><span style="height:0"></span></span>
        <span class="cut"><span style="height:38px"></span></span>
        <span class="cut waxed"><span style="height:18px"></span></span>
        <span class="cut"><span style="height:47px"></span></span>
        <span class="cut"><span style="height:25px"></span></span>
        <span class="cut"><span style="height:53px"></span></span>
        <span class="cut"><span style="height:15px"></span></span>
        <span class="cut"><span style="height:36px"></span></span>
        <span class="cut today"><span style="height:41px"></span></span>
      </div>
    </div>
    <div class="stripCaps"><span class="caps">28 Feb</span><span class="caps">Today</span></div>
  </div>

  <div class="lamp">
    <span class="lampGlow"></span>
    <div class="panel wood">
      <div class="caps">Reading</div>
      <p>Thursdays run a third above the rest.</p>
    </div>
  </div>

  <div class="kept caps">Kept 61 days · longest run 19</div>

  <div class="rack">
    <div class="staves">
      <span class="rstave wood" style="height:80px"><span class="end" style="background:#3E4247"></span><span class="sc"></span><span class="score"></span></span>
      <span class="rstave wood" style="height:88px"><span class="end" style="background:#A2361B"></span><span class="sc"></span><span class="score"></span></span>
      <span class="rstave wood" style="height:76px"><span class="end" style="background:#7E5C12"></span><span class="sc"></span><span class="score"></span></span>
      <span class="rstave wood" style="height:92px"><span class="end" style="background:#A2361B"></span><span class="sc"></span><span class="score"></span></span>
      <span class="rstave wood" style="height:82px"><span class="end" style="background:#2C6650"></span><span class="sc"></span><span class="score"></span></span>
      <span class="rstave wood" style="height:98px"><span class="end" style="background:#5C3A6B"></span><span class="sc"></span><span class="score"></span></span>
      <span class="rstave wood" style="height:86px"><span class="end" style="background:#A2361B"></span><span class="sc"></span><span class="score"></span></span>
      <span class="rstave wood" style="height:94px"><span class="end" style="background:#17506A"></span><span class="sc"></span><span class="score"></span></span>
      <span class="rstave wood" style="height:78px"><span class="end" style="background:#A2361B"></span><span class="sc"></span><span class="score"></span></span>
    </div>
    <div class="rackRail"></div>
  </div>

  <div class="tabbar">
    <span class="tab on"><span class="tabGlyph">
      <svg width="22" height="18" viewBox="0 0 22 18"><g fill="currentColor"><path d="M1 2h2.6l-.6 12H1.6z"/><path d="M6 2h2.6l-.6 12H6.6z"/><path d="M11 2h2.6l-.6 12h-1.4z"/><path d="M16 2h2.6l-.6 12h-1.4z"/></g><path d="M.5 4.5 20 13" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
    </span>Bench</span>
    <span class="tab"><span class="tabGlyph">
      <svg width="20" height="18" viewBox="0 0 20 18"><g fill="currentColor"><rect x="1" y="2" width="18" height="2.4" rx="1.2"/><rect x="1" y="7.8" width="18" height="2.4" rx="1.2"/><rect x="1" y="13.6" width="18" height="2.4" rx="1.2"/></g></svg>
    </span>Ledger</span>
    <span class="tab"><span class="tabGlyph">
      <svg width="19" height="19" viewBox="0 0 19 19"><circle cx="9.5" cy="9.5" r="7.6" fill="none" stroke="currentColor" stroke-width="2.2"/><circle cx="9.5" cy="9.5" r="2.2" fill="currentColor"/></svg>
    </span>Settings</span>
    <span class="home"></span>
  </div>
</body>
</html>
