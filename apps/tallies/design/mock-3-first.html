<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tallies · a bare bench</title>
<style>
  :root{
    --canvas:#C3B9A3; --surface:#F0E5CC; --ink:#221A0F; --inkSoft:#4C4334;
    --accent:#17506A; --onAccent:#FFF3E8; --highlight:#A2361B;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
  html,body{width:440px;height:956px;overflow:hidden}
  body{background:var(--canvas);color:var(--ink);position:relative;
    font-family:-apple-system,"SF Pro Text",system-ui,sans-serif}
  .glow{position:absolute;inset:0;
    background:radial-gradient(circle 470px at 24% 2%, rgba(216,207,188,.62) 0%, rgba(216,207,188,0) 64%)}
  .wash{position:absolute;inset:0;opacity:.5;
    background:
      repeating-linear-gradient(2.4deg, rgba(34,26,15,.034) 0 1px, transparent 1px 7px),
      repeating-linear-gradient(-1.6deg, rgba(34,26,15,.024) 0 1px, transparent 1px 11px)}
  .display{font-family:-apple-system,"SF Pro Display",system-ui;font-weight:860;font-stretch:75%;
    letter-spacing:-.02em}
  .caps{font-family:ui-monospace,"SF Mono",monospace;text-transform:uppercase;
    letter-spacing:2.6px;font-size:10.5px;color:var(--inkSoft)}

  .status{position:absolute;top:0;left:0;right:0;height:var(--safe-top,62px);
    display:flex;align-items:flex-end;justify-content:space-between;
    padding:0 30px 12px;font-size:15px;font-weight:600}
  .statusR{display:flex;align-items:center;gap:6px}
  .bars{display:flex;align-items:flex-end;gap:2px;height:11px}
  .bars i{width:3px;background:var(--ink);border-radius:1px}
  .bars i:nth-child(1){height:4px}.bars i:nth-child(2){height:6px}
  .bars i:nth-child(3){height:8.5px}.bars i:nth-child(4){height:11px}
  .batt{width:25px;height:12px;border:1.2px solid var(--ink);border-radius:3.5px;position:relative;opacity:.9}
  .batt::after{content:'';position:absolute;inset:1.8px;width:13px;background:var(--ink);border-radius:1.5px}

  .navbar{position:absolute;top:var(--safe-top,62px);left:0;right:0;height:50px;
    display:flex;align-items:center;justify-content:flex-end;padding:0 22px}
  .largeTitle{position:absolute;top:calc(var(--safe-top,62px) + 44px);left:22px;
    font-size:40px;line-height:1.05}
  .benchEdge{position:absolute;top:188px;left:0;right:0;height:4px;
    background:rgba(34,26,15,.13);border-top:1px solid rgba(162,54,27,.34)}

  .art{position:absolute;top:202px;left:0;right:0;display:flex;justify-content:center;
    transform:scale(1.1);transform-origin:50% 0}

  .say{position:absolute;top:626px;left:30px;right:30px;text-align:center}
  .say h2{font-size:36px;line-height:1.06;margin-bottom:11px}
  .say p{font-size:17px;line-height:1.42;color:var(--inkSoft)}

  .cta{position:absolute;left:32px;right:32px;bottom:calc(var(--safe-bottom,34px) + 49px + 40px);
    height:54px;border-radius:27px;background:var(--accent);color:var(--onAccent);
    display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:600;
    box-shadow:0 10px 20px rgba(23,80,106,.32), inset 0 1px 0 rgba(255,255,255,.24)}

  .tabbar{position:absolute;left:0;right:0;bottom:0;height:calc(var(--safe-bottom,34px) + 49px);
    background:rgba(240,229,204,.74);backdrop-filter:blur(24px);
    border-top:.5px solid rgba(34,26,15,.18);display:flex;justify-content:space-around;padding-top:7px}
  .tab{display:flex;flex-direction:column;align-items:center;gap:4px;width:88px;font-size:10px;color:var(--inkSoft)}
  .tab.on{color:var(--accent)}
  .tabGlyph{height:20px;display:flex;align-items:center}
  .home{position:absolute;left:50%;transform:translateX(-50%);bottom:9px;
    width:140px;height:5px;border-radius:3px;background:rgba(34,26,15,.34)}
</style>
</head>
<body>
  <div class="glow"></div><div class="wash"></div>

  <div class="status">
    <span>9:41</span>
    <span class="statusR"><span class="bars"><i></i><i></i><i></i><i></i></span>
      <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 10.6 5.4 8a3.7 3.7 0 0 1 5.2 0L8 10.6Zm-5.1-5.1a8.6 8.6 0 0 1 10.2 0l-1.5 1.5a6.5 6.5 0 0 0-7.2 0L2.9 5.5ZM.5 3.1a12 12 0 0 1 15 0l-1.5 1.5a9.9 9.9 0 0 0-12 0L.5 3.1Z" fill="#221A0F"/></svg>
      <span class="batt"></span></span>
  </div>

  <div class="navbar">
    <!-- the toolbar add is a bare stave with the first notch cut into it:
         the app's own shape, and it still reads at 22pt -->
    <svg width="26" height="26" viewBox="0 0 26 26">
      <path d="M3.4 4.6h19.2a1.6 1.6 0 0 1 1.6 1.6v13.6a1.6 1.6 0 0 1-1.6 1.6H3.4a1.6 1.6 0 0 1-1.6-1.6V6.2a1.6 1.6 0 0 1 1.6-1.6Z"
            fill="none" stroke="#17506A" stroke-width="2.1"/>
      <path d="M9.4 4.6h7.2L13 13.4Z" fill="#17506A"/>
    </svg>
  </div>
  <div class="largeTitle display">Tallies</div>
  <div class="benchEdge"></div>

  <div class="art">
    <!-- design/art/bench.svg: the bare bench, the chisel on the rail, shavings, the empty rack -->
    <svg width="400" height="410" viewBox="0 0 400 410">
      <defs>
        <linearGradient id="ash" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#F8F1DF"/><stop offset=".44" stop-color="#F0E5CC"/>
          <stop offset="1" stop-color="#D9C39A"/>
        </linearGradient>
        <linearGradient id="ashEnd2" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#E7D9B8"/><stop offset="1" stop-color="#BCA274"/>
        </linearGradient>
        <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#E8C275"/><stop offset="1" stop-color="#8A6A16"/>
        </linearGradient>
        <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#E3E8EB"/><stop offset=".46" stop-color="#7E868D"/>
          <stop offset=".78" stop-color="#AEB6BC"/><stop offset="1" stop-color="#5C646A"/>
        </linearGradient>
        <linearGradient id="handle" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#D9BE8D"/><stop offset=".48" stop-color="#B08F58"/>
          <stop offset="1" stop-color="#7A5C33"/>
        </linearGradient>
      </defs>

      <!-- the rack on the wall behind, empty and waiting -->
      <g>
        <rect x="30" y="52" width="340" height="6" rx="3" fill="url(#brass)" opacity=".62"/>
        <rect x="30" y="150" width="340" height="6" rx="3" fill="url(#brass)" opacity=".68"/>
        <g stroke="#221A0F" stroke-opacity=".09" stroke-width="1.4">
          <path d="M92 58v92M200 58v92M308 58v92"/>
        </g>
        <!-- the cut recesses the staves will stand in -->
        <g fill="#221A0F" fill-opacity=".10">
          <rect x="46" y="150" width="18" height="6" rx="1"/><rect x="82" y="150" width="18" height="6" rx="1"/>
          <rect x="118" y="150" width="18" height="6" rx="1"/><rect x="154" y="150" width="18" height="6" rx="1"/>
          <rect x="190" y="150" width="18" height="6" rx="1"/><rect x="226" y="150" width="18" height="6" rx="1"/>
          <rect x="262" y="150" width="18" height="6" rx="1"/><rect x="298" y="150" width="18" height="6" rx="1"/>
          <rect x="334" y="150" width="18" height="6" rx="1"/>
        </g>
      </g>

      <!-- the bench top, the app's horizon -->
      <rect x="0" y="236" width="400" height="12" rx="3" fill="#221A0F" fill-opacity=".16"/>
      <rect x="0" y="233" width="400" height="2.5" fill="#A2361B" fill-opacity=".38"/>

      <!-- a bare stave, cut to length, lying on the bench -->
      <g transform="rotate(-2.2 200 204)">
        <rect x="38" y="172" width="318" height="62" rx="5" fill="url(#ash)"/>
        <rect x="38" y="228" width="318" height="6" rx="3" fill="#221A0F" fill-opacity=".26"/>
        <rect x="38" y="172" width="17" height="62" rx="2" fill="#A2361B"/>
        <rect x="38" y="172" width="17" height="3" fill="#FFFFFF" fill-opacity=".2"/>
        <g stroke="#6A4A2A" stroke-opacity=".17" stroke-width="1.1">
          <path d="M62 182h286M62 194h286M62 207h286M62 219h286"/>
        </g>
        <!-- the ghost of the first notch, where the blade will land: the whole
             of the teaching, and it disappears the moment it has worked -->
        <path d="M234 172l7 22 7-22z" fill="#221A0F" fill-opacity=".20"/>
        <path d="M234 172h14" stroke="#221A0F" stroke-opacity=".26" stroke-width="1.4"/>
      </g>

      <!-- the chisel, resting on the shoulder -->
      <g transform="rotate(-21 244 164)">
        <rect x="233" y="60" width="23" height="64" rx="11" fill="url(#handle)"/>
        <rect x="230" y="120" width="29" height="15" rx="2" fill="url(#brass)"/>
        <rect x="230" y="120" width="29" height="2" fill="#FFFFFF" fill-opacity=".4"/>
        <path d="M233 133h23v16l-3.7 4h-15.6L233 149z" fill="url(#steel)"/>
        <path d="M224 149h41v36l-20.5 18L224 185z" fill="url(#steel)"/>
        <path d="M224 172h41v13l-20.5 18L224 185z" fill="#FFFFFF" fill-opacity=".38"/>
      </g>

      <!-- shavings: tapered curls planed off the stave, not rings -->
      <g>
        <path d="M62 322c-6-30 14-52 40-50 22 2 32 20 24 34-7 12-24 14-30 4-5-9 2-18 11-17 6 1 9 6 7 11
                 3-11-8-19-18-15-14 5-18 22-12 35z"
              fill="#F0E5CC" stroke="#221A0F" stroke-opacity=".14" stroke-width="1"/>
        <path d="M62 322c-6-30 14-52 40-50 6 1 11 3 15 6-24-2-45 18-42 44z" fill="#D9C39A"/>
        <path d="M132 324c-4-20 10-34 27-32 14 1 21 13 16 22-5 8-16 9-20 3-3-6 2-12 8-11
                 -4 6 1 11 6 8 5-4 3-12-5-14-10-2-18 9-15 22z"
              fill="#F8F1DF" stroke="#221A0F" stroke-opacity=".13" stroke-width="1"/>
        <path d="M188 310c14-6 22-4 26 2-8 5-18 6-26 2z" fill="#E4D5B2"/>
        <path d="M214 322c9-4 15-2 17 2-5 4-12 4-17 1z" fill="#E4D5B2"/>
      </g>

      <!-- offcut ends, stacked at the right, cut to length -->
      <g>
        <rect x="268" y="316" width="94" height="18" rx="4" fill="url(#ashEnd2)"/>
        <rect x="268" y="316" width="94" height="2.5" fill="#FFFFFF" fill-opacity=".42"/>
        <rect x="278" y="296" width="94" height="18" rx="4" fill="url(#ashEnd2)"/>
        <rect x="278" y="296" width="94" height="2.5" fill="#FFFFFF" fill-opacity=".42"/>
        <rect x="272" y="276" width="94" height="18" rx="4" fill="url(#ashEnd2)"/>
        <rect x="272" y="276" width="94" height="2.5" fill="#FFFFFF" fill-opacity=".42"/>
        <g fill="#221A0F" fill-opacity=".2">
          <rect x="268" y="332" width="94" height="2.5" rx="1.2"/>
          <rect x="278" y="312" width="94" height="2.5" rx="1.2"/>
          <rect x="272" y="292" width="94" height="2.5" rx="1.2"/>
        </g>
      </g>
    </svg>
  </div>

  <div class="say">
    <h2 class="display">A bare bench</h2>
    <p>There is ash cut to length and a chisel on the rail.<br>Say what the first stave is for.</p>
  </div>

  <div class="cta">Lay a stave on the bench</div>

  <div class="tabbar">
    <span class="tab on"><span class="tabGlyph">
      <svg width="22" height="18" viewBox="0 0 22 18"><g fill="currentColor"><path d="M1 2h2.6l-.6 12H1.6z"/><path d="M6 2h2.6l-.6 12H6.6z"/><path d="M11 2h2.6l-.6 12h-1.4z"/><path d="M16 2h2.6l-.6 12h-1.4z"/></g><path d="M.5 4.5 20 13" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
    </span>Bench</span>
    <span class="tab"><span class="tabGlyph">
      <svg width="20" height="18" viewBox="0 0 20 18"><g fill="currentColor"><rect x="1" y="2" width="18" height="2.4" rx="1.2"/><rect x="1" y="7.8" width="18" height="2.4" rx="1.2"/><rect x="1" y="13.6" width="18" height="2.4" rx="1.2"/></g></svg>
    </span>Ledger</span>
    <span class="tab"><span class="tabGlyph">
      <svg width="19" height="19" viewBox="0 0 19 19"><circle cx="9.5" cy="9.5" r="7.6" fill="none" stroke="currentColor" stroke-width="2.2"/><circle cx="9.5" cy="9.5" r="2.2" fill="currentColor"/></svg>
    </span>Settings</span>
    <span class="home"></span>
  </div>
</body>
</html>
