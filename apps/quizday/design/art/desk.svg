<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" fill="none">
  <!-- Top-down: a cup with a ring stain, a folded sheet, a pencil, a brass clip.
       The morning, after the edition is filed. -->

  <!-- the ring the cup left earlier -->
  <circle cx="292" cy="78" r="42" stroke="#8E6214" stroke-width="5" opacity="0.35" fill="none"/>

  <g stroke="#1B2027" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">

    <!-- the folded sheet -->
    <path d="M26 92h186v198H26z" fill="#FBF7EC"/>
    <path d="M26 178h186" stroke-width="3" opacity="0.4"/>
    <path d="M52 118h134M52 138h134M52 208h134M52 228h100" stroke-width="3.5" opacity="0.55"/>
    <path d="M52 158h74" stroke="#C1362C" stroke-width="5"/>

    <!-- the cup, seen from above -->
    <circle cx="296" cy="196" r="62" fill="#FBF7EC"/>
    <circle cx="296" cy="196" r="44" fill="#8E6214" opacity="0.85" stroke="none"/>
    <circle cx="296" cy="196" r="44" fill="none"/>
    <path d="M356 178c22-8 30 10 22 26-6 12-20 14-28 8" fill="none"/>

    <!-- the pencil, at an angle across the corner -->
    <g transform="rotate(-24 250 66)">
      <path d="M158 54h150v24H158z" fill="#8E6214"/>
      <path d="M308 54h34v24h-34z" fill="#FBF7EC"/>
      <path d="M342 54 368 66 342 78z" fill="#1B2027"/>
      <path d="M182 54v24M206 54v24" stroke-width="2.5" opacity="0.45"/>
    </g>

    <!-- the brass clip -->
    <path d="M66 46h56v34H66z" fill="#8E6214"/>
    <path d="M80 46v34" stroke-width="3" opacity="0.5"/>
  </g>
</svg>
