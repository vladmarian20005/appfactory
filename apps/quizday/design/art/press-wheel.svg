<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- The press's spoked flywheel, alone and centred on its own hub, so it can be
       rotated in place over press-body.svg. Turns once every 20 s; stands still
       for Motion.isStill and Reduce Motion. -->
  <g stroke="#1B2027" stroke-linecap="round">
    <circle cx="60" cy="60" r="50" stroke-width="9" fill="none"/>
    <g stroke-width="5">
      <path d="M60 16v88M60 16v88" transform="rotate(0 60 60)"/>
      <path d="M60 16v88" transform="rotate(60 60 60)"/>
      <path d="M60 16v88" transform="rotate(120 60 60)"/>
    </g>
    <circle cx="60" cy="60" r="13" fill="#8E6214" stroke-width="5"/>
    <circle cx="60" cy="60" r="3.5" fill="#1B2027" stroke="none"/>
    <!-- the handle on the rim -->
    <circle cx="60" cy="10" r="7" fill="#C1362C" stroke-width="4"/>
  </g>
</svg>
